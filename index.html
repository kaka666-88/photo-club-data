<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>留声光影 - 摄影社团</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0b;--bg2:#141416;--bg3:#1c1c1f;--card:#1e1e22;--hover:#26262b;
  --border:#2a2a30;--text:#e8e8e8;--text2:#9a9aa0;--muted:#5c5c62;
  --gold:#c8a44e;--gold2:#d8b45e;--gold-dim:rgba(200,164,78,0.12);
  --green:#5cb85c;--red:#d4574e;--blue:#4a90d9;
  --r:8px;--rs:5px;--safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;border-radius:var(--rs);background:none;color:inherit}
input,textarea,select{font-family:var(--font);background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--rs);outline:none;width:100%;font-size:15px;box-sizing:border-box}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:80px}
::-webkit-scrollbar{width:0;height:0}

/* ===== Login ===== */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000}
#loginScreen .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.35) blur(2px);transform:scale(1.1)}
#loginScreen .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,0.6) 0%,rgba(10,10,11,0.9) 100%)}
.login-card{position:relative;z-index:1;width:90%;max-width:360px;text-align:center}
.login-card .logo{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--bg);font-weight:bold}
.login-card h1{font-size:24px;font-weight:600;margin-bottom:6px;color:var(--text)}
.login-card .sub{font-size:14px;color:var(--text2);margin-bottom:28px}
.login-btn{width:100%;padding:13px;border-radius:var(--rs);font-size:15px;font-weight:500;margin-top:10px;transition:opacity .2s}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-gold:active{opacity:0.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:active{background:var(--hover)}
.login-hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* ===== App Layout ===== */
#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}
.page-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0.12;transition:background-image .6s ease}
.main-content{position:relative;z-index:1;flex:1;padding-bottom:70px;padding-bottom:calc(70px + var(--safe-b));min-height:100vh}

/* ===== Bottom Tab Bar ===== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(20,20,22,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 6px;gap:2px;color:var(--muted);transition:color .2s;font-size:11px}
.tab-item .icon{font-size:22px;line-height:1}
.tab-item.active{color:var(--gold)}
.tab-item:active{color:var(--text2)}

/* ===== Page Header ===== */
.page-head{padding:16px 16px 8px}
.page-head h2{font-size:20px;font-weight:600}
.page-head .desc{font-size:13px;color:var(--text2);margin-top:2px}

/* ===== Hero Section (Home) ===== */
.hero{position:relative;width:100%;height:42vh;min-height:280px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,0.1) 0%,rgba(10,10,11,0.5) 50%,rgba(10,10,11,0.95) 100%)}
.hero .info{position:absolute;bottom:20px;left:16px;right:16px}
.hero .info h1{font-size:26px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.hero .info p{font-size:13px;color:var(--text2);margin-top:4px}
.hero .photo-credit{position:absolute;top:12px;right:12px;font-size:11px;color:rgba(255,255,255,0.5);background:rgba(0,0,0,0.4);padding:3px 8px;border-radius:10px}

/* ===== Stats Grid ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 8px;text-align:center}
.stat .num{font-size:22px;font-weight:700;color:var(--gold)}
.stat .lbl{font-size:11px;color:var(--text2);margin-top:2px}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:0 16px 12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.card-title .more{font-size:12px;color:var(--gold);font-weight:400}

/* ===== Activity Cards ===== */
.act-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 12px;overflow:hidden}
.act-card .act-head{padding:14px}
.act-card .act-title{font-size:16px;font-weight:600}
.act-card .act-meta{font-size:12px;color:var(--text2);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
.act-card .act-meta span{display:inline-flex;align-items:center;gap:3px}
.act-card .act-body{padding:0 14px 14px;font-size:13px;color:var(--text2);line-height:1.7}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-green{background:rgba(92,184,92,0.15);color:var(--green)}
.tag-blue{background:rgba(74,144,217,0.15);color:var(--blue)}
.tag-gray{background:rgba(90,90,98,0.2);color:var(--muted)}
.tag-gold{background:var(--gold-dim);color:var(--gold)}

/* ===== Photo Gallery ===== */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:16px}
.gallery .item{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.gallery .item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery .item:active img{transform:scale(0.97)}
.gallery .item .caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.8));padding:20px 8px 6px;font-size:11px}
.gallery .item .caption .t{font-weight:600;color:#fff}
.gallery .item .caption .a{color:rgba(255,255,255,0.7);font-size:10px}
.gallery .item.full{grid-column:span 2;aspect-ratio:2}

/* ===== Members List ===== */
.mem-list{padding:16px}
.mem-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.mem-item:last-child{border-bottom:none}
.mem-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--bg);font-weight:600;flex-shrink:0}
.mem-info{flex:1;min-width:0}
.mem-info .name{font-size:14px;font-weight:500}
.mem-info .role{font-size:12px;color:var(--text2)}
.mem-points{font-size:14px;font-weight:600;color:var(--gold)}

/* ===== Leaderboard ===== */
.lb{padding:16px}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.lb-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text2)}
.lb-rank.r1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000}
.lb-rank.r2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#000}
.lb-rank.r3{background:linear-gradient(135deg,#CD7F32,#B87333);color:#000}
.lb-name{flex:1;font-size:14px;font-weight:500}
.lb-score{font-size:16px;font-weight:700;color:var(--gold)}

/* ===== Knowledge/News/Tips List ===== */
.kn-item{padding:14px 0;border-bottom:1px solid var(--border)}
.kn-item:last-child{border-bottom:none}
.kn-item .kn-cat{font-size:11px;color:var(--gold);margin-bottom:4px}
.kn-item .kn-title{font-size:15px;font-weight:500;line-height:1.4}
.kn-item .kn-preview{font-size:13px;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kn-item .kn-date{font-size:11px;color:var(--muted);margin-top:4px}

/* ===== About Page ===== */
.about-section{padding:16px}
.about-section h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--gold)}
.about-section p{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:12px}
.about-section .quote{font-size:18px;font-weight:600;text-align:center;color:var(--gold);margin:20px 0;padding:0 20px;line-height:1.6}
.about-section .feishu-link{display:block;text-align:center;margin-top:16px;padding:12px;border:1px solid var(--gold);border-radius:var(--r);color:var(--gold);font-size:14px}

/* ===== Settings ===== */
.set-group{padding:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row label{font-size:14px;color:var(--text2);flex-shrink:0;width:80px}
.set-row input{flex:1;max-width:200px}
.set-btn{width:100%;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:500;margin-top:8px}

/* ===== Modal / Bottom Sheet ===== */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 20px calc(20px + var(--safe-b));animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px}
.modal .close{position:absolute;top:16px;right:16px;font-size:24px;color:var(--muted);background:none;border:none}
.modal .form-row{margin-bottom:12px}
.modal .form-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.modal .form-actions{display:flex;gap:10px;margin-top:16px}
.modal .form-actions button{flex:1;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:500}

/* ===== Toast ===== */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;padding:10px 20px;border-radius:20px;font-size:13px;background:var(--gold);color:var(--bg);font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red);color:#fff}

/* ===== Empty State ===== */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

/* ===== Photo Viewer ===== */
#photoViewer{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;flex-direction:column}
#photoViewer.show{display:flex}
#photoViewer img{max-width:100%;max-height:85vh;object-fit:contain}
#photoViewer .pv-info{color:var(--text2);font-size:14px;margin-top:12px;text-align:center}
#photoViewer .pv-close{position:absolute;top:16px;right:16px;font-size:28px;color:var(--text2);background:none;border:none}

/* ===== Misc ===== */
.section-gap{height:8px}
.filter-bar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-bar .chip{padding:6px 14px;border-radius:16px;font-size:12px;white-space:nowrap;border:1px solid var(--border);color:var(--text2);background:var(--bg2)}
.filter-bar .chip.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div id="loginScreen">
  <div class="bg" id="loginBg"></div>
  <div class="overlay"></div>
  <div class="login-card">
    <div class="logo">&#128247;</div>
    <h1>留声光影</h1>
    <p class="sub">用镜头记录世界，用光影讲述故事</p>
    <div id="adminLoginForm" style="margin-top:20px;text-align:left">
      <input id="loginUser" placeholder="账号" style="margin-bottom:8px" autocomplete="username">
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
      <button class="login-btn btn-gold" onclick="adminLoginSubmit()">管理员登录</button>
    </div>
    <button class="login-btn btn-ghost" onclick="doGuestLogin()">访客进入</button>
    <p class="login-hint">留声光影摄影社团 · 成员作品展示与活动管理</p>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <div class="page-bg" id="pageBg"></div>
  <div class="main-content" id="mainContent"></div>
  <nav class="tab-bar">
    <div class="tab-item active" data-page="home" onclick="navigate('home')">
      <span class="icon">&#127968;</span><span>首页</span>
    </div>
    <div class="tab-item" data-page="gallery" onclick="navigate('gallery')">
      <span class="icon">&#128247;</span><span>作品</span>
    </div>
    <div class="tab-item" data-page="activities" onclick="navigate('activities')">
      <span class="icon">&#128197;</span><span>活动</span>
    </div>
    <div class="tab-item" data-page="about" onclick="navigate('about')">
      <span class="icon">&#8505;</span><span>社团</span>
    </div>
    <div class="tab-item" data-page="settings" onclick="navigate('settings')">
      <span class="icon">&#9881;</span><span>我的</span>
    </div>
  </nav>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ===== Photo Viewer ===== -->
<div id="photoViewer" onclick="closePhotoViewer(event)">
  <button class="pv-close" onclick="closePhotoViewer()">&times;</button>
  <img id="pvImg" src="">
  <div class="pv-info" id="pvInfo"></div>
</div>

<!-- ===== Toast ===== -->
<div id="toast"></div>

// ===== API Layer (GitHub Sync) =====
const API = {
  _data:null,_nextId:1,_remoteSha:null,_pollTimer:null,_writeTimer:null,
  _savingFromRemote:false,_skipNextSync:false,_lastSync:0,

  _isConfigured(){const c=ghCfg();return !!(c.owner&&c.repo&&c.branch);},
  _hasToken(){const c=ghCfg();return !!(c.token);},
  _rawUrl(){const c=ghCfg();return 'https://raw.githubusercontent.com/'+c.owner+'/'+c.repo+'/'+c.branch+'/data.json?t='+Date.now();},
  _apiUrl(){const c=ghCfg();return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/data.json';},
  _encodeBase64(s){return btoa(unescape(encodeURIComponent(s)));},

  async _readRemote(){
    if(!this._isConfigured())return null;
    try{
      let text;
      if(this._hasToken()){
        const c=ghCfg();
        const r=await fetch(this._apiUrl()+'?ref='+c.branch+'&t='+Date.now(),{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json'}});
        if(!r.ok)return null;
        const fd=await r.json();
        text=atob(fd.content.replace(/\n/g,''));
        this._remoteSha=fd.sha;
      }else{
        const r=await fetch(this._rawUrl());
        if(!r.ok)return null;
        text=await r.text();
      }
      if(!text||text.trim().startsWith('<'))return null;
      return JSON.parse(text);
    }catch(e){return null;}
  },

  async _writeRemote(){
    if(!this._isConfigured())return false;
    if(!this._hasToken()){console.warn('No token');return false;}
    const c=ghCfg();
    try{
      let sha=null;
      try{
        const gr=await fetch(this._apiUrl(),{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){const fd=await gr.json();sha=fd.sha;this._remoteSha=sha;}
      }catch(e){}
      const d=JSON.parse(JSON.stringify(this._data));delete d.sessions;
      const content=this._encodeBase64(JSON.stringify(d,null,2));
      const body=JSON.stringify({message:'Update '+new Date().toISOString(),content:content,sha:sha||undefined,branch:c.branch});
      const pr=await fetch(this._apiUrl(),{method:'PUT',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:body});
      if(pr.ok){const res=await pr.json();this._remoteSha=res.content.sha;this._skipNextSync=true;this._lastSync=Date.now();return true;}
      const et=await pr.text();console.error('Write failed:',pr.status,et);showToast('同步失败:'+pr.status,true);return false;
    }catch(e){console.error('Write error:',e);return false;}
  },

  _scheduleWrite(){if(this._writeTimer)clearTimeout(this._writeTimer);this._writeTimer=setTimeout(()=>{this._writeRemote();},2000);},

  async _syncFromRemote(){
    if(this._skipNextSync){this._skipNextSync=false;this._lastSync=Date.now();return false;}
    const r=await this._readRemote();if(!r)return false;
    const ls=this._data.sessions||{};this._data=r;this._data.sessions=ls;
    const all=[...(this._data.members||[]),...(this._data.activities||[]),...(this._data.knowledge||[]),...(this._data.news||[]),...(this._data.tips||[])];
    this._nextId=Math.max(0,...all.map(x=>x.id||0))+1;
    this._savingFromRemote=true;this._save();this._savingFromRemote=false;
    this._lastSync=Date.now();
    if(state.role&&typeof renderPage==='function'){await store.loadAll();renderPage(state.currentPage);}
    return true;
  },

  startPolling(){if(this._pollTimer)clearInterval(this._pollTimer);this._pollTimer=setInterval(()=>{this._syncFromRemote();},30000);},

  _init(){
    const s=localStorage.getItem("photoClubData");
    if(s){this._data=JSON.parse(s);}
    else{this._data=JSON.parse(JSON.stringify(SEED_DATA));this._data.knowledge.forEach((k,i)=>{k.id=i+1;k.created_at=new Date().toISOString();});this._data.tips.forEach((t,i)=>{t.id=i+1;t.created_at=new Date().toISOString();});this._data.news.forEach((n,i)=>{n.id=i+1;n.created_at=new Date().toISOString();});this._data.sessions={};this._nextId=100;this._save();}
    if(!this._data.sessions)this._data.sessions={};
  },

  _save(){localStorage.setItem("photoClubData",JSON.stringify(this._data));if(!this._savingFromRemote)this._scheduleWrite();},
  _genId(){return this._nextId++;},

  adminLogin(u,p){
    const s=this._data.settings;
    if(u===s.admin_user&&p===s.admin_pass){
      const t="admin_"+Date.now()+"_"+Math.random().toString(36).slice(2);
      this._data.sessions[t]={role:"admin",user:u};this._save();
      localStorage.setItem('photoClubAdminUser',u);localStorage.setItem('photoClubAdminPass',p);
      return Promise.resolve({token:t,role:"admin",user:u});
    }
    return Promise.reject(new Error("账号或密码错误"));
  },
  guestLogin(){const t="guest_"+Date.now()+"_"+Math.random().toString(36).slice(2);this._data.sessions[t]={role:"guest",user:"访客"};this._save();return Promise.resolve({token:t,role:"guest",user:"访客"});},
  getSettings(){return Promise.resolve(Object.assign({},this._data.settings));},
  updateSettings(d){
    if(d.admin_user)this._data.settings.admin_user=d.admin_user;
    if(d.admin_pass)this._data.settings.admin_pass=d.admin_pass;
    if(d.club_name)this._data.settings.club_name=d.club_name;
    if(d.club_desc!==undefined)this._data.settings.club_desc=d.club_desc;
    this._save();return Promise.resolve({message:"设置已保存"});
  },
  getMembers(){return Promise.resolve(this._data.members);},
  createMember(d){const m={id:this._genId(),name:d.name,role:d.role||"member",join_date:d.join_date||new Date().toISOString().slice(0,10),contact:d.contact||"",points:0,created_at:new Date().toISOString()};this._data.members.unshift(m);this._save();this._writeRemote();return Promise.resolve(m);},
  updateMember(id,d){const m=this._data.members.find(x=>x.id===id);if(m){if(d.name!==undefined)m.name=d.name;if(d.role!==undefined)m.role=d.role;if(d.contact!==undefined)m.contact=d.contact;if(d.points!==undefined)m.points=d.points;}this._save();this._writeRemote();return Promise.resolve(m);},
  deleteMember(id){this._data.members=this._data.members.filter(x=>x.id!==id);this._save();this._writeRemote();return Promise.resolve({});},
  getActivities(){return Promise.resolve(this._data.activities);},

  deleteActivity(id){this._data.activities=this._data.activities.filter(x=>x.id!==id);this._save();this._writeRemote();return Promise.resolve({});},
  getKnowledge(){return Promise.resolve(this._data.knowledge);},

  deleteKnowledge(id){this._data.knowledge=this._data.knowledge.filter(x=>x.id!==id);this._save();this._writeRemote();return Promise.resolve({});},

  deleteTip(id){this._data.tips=this._data.tips.filter(x=>x.id!==id);this._save();this._writeRemote();return Promise.resolve({});},

// ===== Store =====
const store={data:null,async loadAll(){this.data=await new Promise(r=>r(API._data));}};

// ===== State =====
let state={role:null,user:null,token:null,currentPage:'home'};

// ===== Utils =====
function $(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return '';return d.slice(0,10);}
function showToast(msg,err){const t=$('toast');t.textContent=msg;t.className=err?'show err':'show';setTimeout(()=>{t.className='';},2500);}
function isAdmin(){return state.role==='admin';}

// ===== Login =====
// Admin form is always visible now
function doGuestLogin(){
  API.guestLogin().then(r=>{state.role='guest';state.user='访客';state.token=r.token;enterApp();});
}
function adminLoginSubmit(){
  try{
    const u=$('loginUser').value.trim();const p=$('loginPass').value.trim();
    if(!u||!p){showToast('请输入账号和密码',true);return;}
    API.adminLogin(u,p).then(r=>{state.role='admin';state.user=r.user;state.token=r.token;enterApp();}).catch(e=>{showToast(e.message,true);});
  }catch(e){showToast('登录出错: '+e.message,true);}
}
function tryRestoreSession(){
  const t=localStorage.getItem('photoClubSession');
  if(t){
    const s=API._data.sessions[t];
    if(s){state.role=s.role;state.user=s.user;state.token=t;return true;}
  }
  // Try auto-login with saved admin credentials
  const au=localStorage.getItem('photoClubAdminUser');
  const ap=localStorage.getItem('photoClubAdminPass');
  if(au&&ap){
    return API.adminLogin(au,ap).then(r=>{state.role='admin';state.user=r.user;state.token=r.token;return true;}).catch(()=>false);
  }
  return false;
}
function enterApp(){
  $('loginScreen').style.display='none';
  $('app').classList.add('show');
  store.loadAll().then(()=>{navigate('home');API.startPolling();});
}
function logout(){
  if(state.token&&API._data.sessions[state.token])delete API._data.sessions[state.token];
  localStorage.removeItem('photoClubSession');
  localStorage.removeItem('photoClubAdminUser');
  localStorage.removeItem('photoClubAdminPass');
  state={role:null,user:null,token:null,currentPage:'home'};
  $('app').classList.remove('show');
  $('loginScreen').style.display='flex';
  $('adminLoginForm').style.display='none';
  $('loginUser').value='';$('loginPass').value='';
}

// ===== Navigation =====
function navigate(page){
  state.currentPage=page;
  document.querySelectorAll('.tab-item').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);});
  // Update background
  const bg=$('pageBg');
  const idx=Math.floor(Math.random()*BG_PHOTOS.length);
  bg.style.backgroundImage='url('+BG_PHOTOS[idx]+')';
  renderPage(page);
  window.scrollTo(0,0);
}

function renderPage(page){
  const main=$('mainContent');
  switch(page){
    case 'home':renderHome(main);break;
    case 'gallery':renderGallery(main);break;
    case 'activities':renderActivities(main);break;
    case 'about':renderAbout(main);break;
    case 'settings':renderSettings(main);break;
  }
}

// ===== Home Page =====
function renderHome(el){
  const d=store.data;
  const members=d.members.length;
  const active=d.activities.filter(a=>a.status==='active').length;
  const totalPts=d.members.reduce((s,m)=>s+(m.points||0),0);
  const knowledge=d.knowledge.length;
  const tips=d.tips.length;
  // Pick a random hero photo
  const hero=PHOTOS[Math.floor(Math.random()*PHOTOS.length)];

  el.innerHTML=`
    <div class="hero">
      <img src="${hero.url}" alt="${esc(hero.title)}" loading="lazy">
      <div class="grad"></div>
      <div class="photo-credit">${esc(hero.author)} · ${esc(hero.title)}</div>
      <div class="info">
        <h1>${esc(d.settings.club_name||'留声光影')}</h1>
        <p>${esc(d.settings.club_desc||'用镜头记录世界，用光影讲述故事')}</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">${members}</div><div class="lbl">社团成员</div></div>
      <div class="stat"><div class="num">${active}</div><div class="lbl">进行中活动</div></div>
      <div class="stat"><div class="num">${totalPts}</div><div class="lbl">累计积分</div></div>
      <div class="stat"><div class="num">${knowledge}</div><div class="lbl">知识库</div></div>

      <div class="stat"><div class="num">${PHOTOS.length}</div><div class="lbl">作品展示</div></div>
    </div>
    ${renderRecentActivities(d)}
    ${renderTopMembers(d)}
  `;
}

function renderRecentActivities(d){
  const recent=[...d.activities].sort((a,b)=>new Date(b.date||b.created_at)-new Date(a.date||a.created_at)).slice(0,3);
  if(!recent.length)return '<div class="empty">暂无活动</div>';
  return `
    <div class="card">
      <div class="card-title">近期活动 <span class="more" onclick="navigate('activities')">全部 &rsaquo;</span></div>
      ${recent.map(a=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:500;font-size:14px">${esc(a.title)}</span>
            <span class="tag ${a.status==='active'?'tag-green':a.status==='done'?'tag-blue':'tag-gray'}">${a.status==='active'?'进行中':a.status==='done'?'已结束':'已取消'}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">${fmtDate(a.date)} ${esc(a.location||'')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTopMembers(d){
  const sorted=[...d.members].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,5);
  if(!sorted.length||sorted.every(m=>!m.points))return '';
  return `
    <div class="card">
      <div class="card-title">积分排行 <span class="more" onclick="navigate('settings')">全部 &rsaquo;</span></div>
      ${sorted.map((m,i)=>`
        <div class="lb-row">
          <div class="lb-rank ${i<3?'r'+(i+1):''}">${i+1}</div>
          <div class="lb-name">${esc(m.name)}</div>
          <div class="lb-score">${m.points||0}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function filterActs(status,el){
  document.querySelectorAll('.filter-bar .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const acts=store.data.activities||[];
  const filtered=status==='all'?acts:acts.filter(a=>a.status===status);
  // Re-render activity list
  const cards=document.querySelectorAll('.act-card');
  cards.forEach(c=>c.remove());
  const main=$('mainContent');
  if(!filtered.length){main.insertAdjacentHTML('beforeend','<div class="empty">暂无活动</div>');return;}
  filtered.forEach(a=>{
    main.insertAdjacentHTML('beforeend',`<div class="act-card">
      <div class="act-head"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="act-title">${esc(a.title)}</div><span class="tag ${a.status==='active'?'tag-green':a.status==='done'?'tag-blue':'tag-gray'}">${a.status==='active'?'进行中':a.status==='done'?'已结束':'已取消'}</span></div><div class="act-meta"><span>&#128197; ${fmtDate(a.date)}</span>${a.location?'<span>&#128205; '+esc(a.location)+'</span>':''}</div></div>
      ${a.description?'<div class="act-body">'+esc(a.description)+'</div>':''}
      ${isAdmin()?'<div style="padding:0 14px 14px"><button class="set-btn btn-ghost" onclick="deleteAct('+a.id+')" style="color:var(--red)">删除</button></div>':''}
    </div>`);

function saveToken(){
  const t=$('ghToken').value.trim();
  const c=ghCfg();c.token=t;
  localStorage.setItem('photoClubGithub',JSON.stringify(c));
  showToast('Token已保存');
  API._writeRemote().then(ok=>{if(ok)showToast('云端同步成功');});
}

// ===== Modal =====
function showModal(html){
  $('modalContent').innerHTML='<button class="close" onclick="closeModal()">&times;</button>'+html;
  $('modalOverlay').classList.add('show');
}
function closeModal(e){
  if(e&&e.target!==$('modalOverlay'))return;
  $('modalOverlay').classList.remove('show');
}

// ===== Init =====
API._init();
// Set login background
$('loginBg').style.backgroundImage='url('+HERO_PHOTO+')';
// Sync from cloud first, then try restore session
(async function(){
  try{
    await API._syncFromRemote();
    const restored=await tryRestoreSession();
    if(restored){enterApp();}
  }catch(e){console.error('Init error:',e);}
})();
</script>
