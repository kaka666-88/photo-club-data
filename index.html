*{margin:0;padding:0;box-sizing:border-box}

// ===== Utils =====
function $(id){return document.getElementById(id);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function showToast(msg,isErr){var t=$("toast");t.textContent=msg;t.className="show "+(isErr?"err":"ok");setTimeout(function(){t.className="";},2500);}

// ===== GitHub Data Layer (per-file, read-merge-write with retry) =====
function ghHeaders(json){var h={"Authorization":"Bearer "+GH.token,"User-Agent":"photo-club"};if(json)h["Content-Type"]="application/json";return h;}

async function readFile(path){
  try{
    var url=API_BASE+encodeURIComponent(path).replace(/%2F/g,"/")+"?ref="+GH.branch;
    var r=await fetch(url,{headers:ghHeaders()});
    if(!r.ok)return null;
    var fd=await r.json();
    var content=fd.content?fd.content.replace(/\n/g,""):"";
    if(!content)return null;
    var text=atob(content);
    if(!text||text.trim().length===0)return null;
    return JSON.parse(text);
  }catch(e){console.error("readFile error:",path,e);return null;}
}

async function writeFile(path,data,retries){
  retries=retries||3;
  for(var attempt=0;attempt<retries;attempt++){
    try{
      var url=API_BASE+encodeURIComponent(path).replace(/%2F/g,"/")+"?ref="+GH.branch;
      var gr=await fetch(url,{headers:ghHeaders()});
      var sha=null;
      if(gr.ok){var fd=await gr.json();sha=fd.sha;}
      var content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
      var body=JSON.stringify({message:"Update "+path+" "+new Date().toISOString(),content:content,sha:sha||undefined,branch:GH.branch});
      var pr=await fetch(url,{method:"PUT",headers:ghHeaders(true),body:body});
      if(pr.ok){return true;}
      if(pr.status===409&&attempt<retries-1){await new Promise(function(r){setTimeout(r,1000);});continue;}
      console.error("writeFile failed:",path,pr.status);
      return false;
    }catch(e){console.error("writeFile error:",path,e);if(attempt<retries-1){await new Promise(function(r){setTimeout(r,1000);});continue;}return false;}
  }
  return false;
}

// Read ALL data files
async function loadAllData(){
  try{
    var results=await Promise.all([
      readFile("data/members.json"),
      readFile("data/shop.json"),
      readFile("data/activities.json"),
      readFile("data/tips.json"),
      readFile("data/news.json"),
      readFile("data/registrations.json"),
      readFile("data/settings.json"),
      readFile("data/points.json")
    ]);
    if(results[0])DB.members=results[0];
    if(results[1])DB.shop=results[1];
    if(results[2])DB.activities=results[2];
    if(results[3])DB.tips=results[3];
    if(results[4])DB.news=results[4];
    if(results[5])DB.registrations=results[5];
    if(results[6])DB.settings=results[6];
    if(results[7])DB.pointsHistory=results[7];
  }catch(e){console.error("loadAllData error:",e);}
}

// Save specific collection (only the file that changed)
async function saveCollection(name){
  var data=DB[name];
  if(name==="settings"){data=DB.settings;}
  if(name==="pointsHistory"){data=DB.pointsHistory;}
  var path="data/"+name+".json";
  return writeFile(path,data);
}

// ===== Session =====
function saveSession(){
  try{
    localStorage.setItem("pc5_role",state.role);
    localStorage.setItem("pc5_user",state.user||"");
    if(state.role==="admin"){
      localStorage.setItem("pc5_adminUser",$("loginUser")?$("loginUser").value:"");
      localStorage.setItem("pc5_adminPass",$("loginPass")?$("loginPass").value:"");
    }else if(state.role==="member"){
      localStorage.setItem("pc5_memberUser",$("loginUser")?$("loginUser").value:"");
      localStorage.setItem("pc5_memberPass",$("loginPass")?$("loginPass").value:"");
    }
  }catch(e){}
}
function clearSession(){
  ["pc5_role","pc5_user","pc5_adminUser","pc5_adminPass","pc5_memberUser","pc5_memberPass"].forEach(function(k){localStorage.removeItem(k);});
}
function tryRestoreSession(){
  var role=localStorage.getItem("pc5_role");
  var user=localStorage.getItem("pc5_user");
  if(!role||!user)return false;
  state.role=role;state.user=user;return true;
}

// ===== Login =====
function memberLoginSubmit(){
  var u=$("loginUser").value.trim();
  var p=$("loginPass").value.trim();
  if(!u||!p){showToast("请输入账号和密码",true);return;}
  var found=false;
  for(var i=0;i<DB.members.length;i++){
    if(DB.members[i].username===u&&DB.members[i].password===p){
      state.role="member";state.user=DB.members[i].name;
      saveSession();enterApp();found=true;break;
    }
  }
  if(!found){
    if(DB.settings.admin_user===u&&DB.settings.admin_pass===p){
      state.role="admin";state.user=u;
      saveSession();enterApp();
    }else{
      $("loginErr").textContent="账号或密码错误";
      showToast("账号或密码错误",true);
    }
  }
}
function doGuestLogin(){state.role="guest";state.user="访客";saveSession();enterApp();}

  box.innerHTML='<img src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png?v=7" alt="留声光影" style="width:107px;height:107px;border-radius:14px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 10px rgba(201,169,110,.5))">'+
    '<h1>注册账号</h1><p class="sub">填写你的信息，管理员审核后即可登录</p>'+

function backToLogin(){

  box.innerHTML='<img src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png?v=7" alt="留声光影" style="width:107px;height:107px;border-radius:14px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 10px rgba(201,169,110,.5))">'+
    '<h1>留声光影</h1><p class="sub">用镜头记录世界，用光影讲述故事</p>'+
    '<div class="form-group"><input id="loginUser" placeholder="账号" autocomplete="username" style="margin-bottom:8px"></div>'+

}
function submitRegister(){
  var u=$("regUser").value.trim();var p=$("regPass").value.trim();var n=$("regName").value.trim();
  if(!u||!p){showToast("请填写账号和密码",true);return;}
  if(u==="admin"){showToast("该账号不可用",true);return;}
  if(!n){showToast("请填写真实姓名",true);return;}
  var reg={username:u,password:p,realName:n,status:"pending",date:new Date().toLocaleDateString()};
  DB.registrations.push(reg);
  saveCollection("registrations").then(function(ok){
    if(ok){showToast("注册提交成功！等待管理员审核");backToLogin();}
    else{showToast("注册失败，请重试",true);}
  });
}
function enterApp(){
  $("loginScreen").style.display="none";
  $("app").style.display="block";
  $("userAvatar").textContent=(state.user||"访")[0];
  switchPage("home");
  startPolling();
}
function logout(){
  if(!confirm("确定退出登录？"))return;
  clearSession();state.role="guest";state.user=null;
  $("app").style.display="none";
  $("loginScreen").style.display="flex";
  backToLogin();
}

// ===== Page Nav =====
function switchPage(page){
  var pages=document.querySelectorAll(".page");
  for(var i=0;i<pages.length;i++)pages[i].classList.remove("active");
  var t=$("page-"+page);if(t)t.classList.add("active");
  var navs=document.querySelectorAll(".nav-item");
  for(var j=0;j<navs.length;j++)navs[j].classList.remove("active");
  var ni=document.querySelector('.nav-item[data-page="'+page+'"]');if(ni)ni.classList.add("active");
  state.currentPage=page;renderPage(page);
}
function renderPage(page){
  switch(page){
    case "home":renderHome();break;
    case "gallery":renderGallery();break;
    case "members":renderMembers();break;
    case "activities":renderActivities();break;
    case "points":renderPoints();break;
    case "tips":renderTips();break;
    case "news":renderNews();break;
    case "shop":renderShop();break;
    case "settings":renderSettings();break;
  }
}

// ===== Hero =====
var heroSlides=BG_PHOTOS.slice();var heroIdx=0;var heroTimer=null;
function renderHero(){
  var wrap=$("heroWrap");if(!wrap)return;
  var html="";
  for(var i=0;i<heroSlides.length;i++)html+='<div class="hero-slide'+(i===0?" active":"")+'" style="background-image:url('+heroSlides[i]+')"></div>';
  html+='<div class="hero-dots">';
  for(var j=0;j<heroSlides.length;j++)html+='<div class="hero-dot'+(j===0?" active":"")+'" onclick="goHeroSlide('+j+')"></div>';
  html+="</div>";
  if(isAdmin())html+='<div class="hero-admin" style="display:flex"><button onclick="showUploadHero()">上传</button><button onclick="showDeleteHero()">删除</button></div>';
  wrap.innerHTML=html;startHeroTimer();
}
function startHeroTimer(){if(heroTimer)clearInterval(heroTimer);heroTimer=setInterval(function(){heroIdx=(heroIdx+1)%heroSlides.length;updateHeroSlide();},5000);}
function updateHeroSlide(){var s=document.querySelectorAll(".hero-slide");var d=document.querySelectorAll(".hero-dot");for(var i=0;i<s.length;i++){s[i].classList.toggle("active",i===heroIdx);d[i].classList.toggle("active",i===heroIdx);}}
function goHeroSlide(idx){heroIdx=idx;updateHeroSlide();startHeroTimer();}
function showUploadHero(){openModal('<h2>上传轮播图</h2><div class="form-row"><label>图片URL</label><input id="heroUrl" placeholder="https://..."></div><button class="btn btn-gold" onclick="submitAddHero()">添加</button>');}
function submitAddHero(){var url=$("heroUrl").value.trim();if(!url){showToast("请输入图片URL",true);return;}heroSlides.push(url);renderHero();closeModal();showToast("轮播图已添加");}
function showDeleteHero(){if(heroSlides.length<=1){showToast("至少保留一张",true);return;}heroSlides.splice(heroIdx,1);heroIdx=0;renderHero();showToast("已删除");}

// ===== Render: Members =====
function renderMembers(){
  var html="";
  var sorted=DB.members.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  for(var i=0;i<sorted.length;i++){var m=sorted[i];
    html+='<div class="member-row"><div class="name">'+esc(m.name)+'</div><div style="display:flex;align-items:center;gap:10px"><div class="pts">'+(m.points||0)+' 积分</div>';
    if(isAdmin())html+='<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;color:var(--red)" onclick="deleteMember('+m.id+')">删除</button>';
    html+='</div></div>';
  }
  if(isAdmin())html='<div style="margin-bottom:10px"><button class="btn btn-gold" onclick="showAddMember()">添加成员</button></div>'+html;
  $("memberList").innerHTML=html||'<div style="color:var(--sub);text-align:center;padding:20px">暂无成员</div>';
}

// ===== Render: Shop =====
var detailImages=[];
function renderShop(){
  var html="";
  for(var i=0;i<DB.shop.length;i++){var item=DB.shop[i];
    var imgSrc=item.img||HERO_PHOTO;
    var stockText=item.stock!==null&&item.stock!==undefined?"库存 "+(item.stock-(item.redeemed||0)):"";
    html+='<div class="shop-card" onclick="showShopDetail('+item.id+')"><div class="img-wrap"><img src="'+esc(imgSrc)+'" loading="lazy" onerror="this.src=\''+HERO_PHOTO+'\'"></div><div class="info"><div class="name">'+esc(item.name)+'</div><div class="price"><span class="pts">'+item.points+'积分</span>'+(item.price?'<span class="orig">¥'+esc(item.price)+'</span>':'')+'</div>'+(stockText?'<div class="stock">'+stockText+'</div>':'')+'</div></div>';
  }
  if(isAdmin())html='<div style="margin-bottom:10px"><button class="btn btn-gold" onclick="addShopItem()">上架商品</button></div>'+html;
  $("shopGrid").innerHTML=html||'<div style="color:var(--sub);text-align:center;padding:20px;grid-column:1/-1">暂无商品</div>';
}
function showShopDetail(id){
  for(var i=0;i<DB.shop.length;i++){if(DB.shop[i].id===id){var item=DB.shop[i];
    var html='<h2>'+esc(item.name)+'</h2>';
    if(item.img)html+='<img src="'+esc(item.img)+'" style="border-radius:8px;margin-bottom:10px">';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="color:var(--gold);font-size:20px;font-weight:700">'+item.points+'积分</span>'+(item.price?'<span style="color:var(--sub);text-decoration:line-through">¥'+esc(item.price)+'</span>':'')+'</div>';
    if(item.description)html+='<p style="color:#ccc;margin-bottom:10px">'+esc(item.description)+'</p>';
    if(item.detail_imgs&&item.detail_imgs.length>0){html+='<div class="detail-imgs">';for(var j=0;j<item.detail_imgs.length;j++)html+='<img src="'+esc(item.detail_imgs[j])+'">';html+='</div>';}
    if(item.detail)html+='<div style="white-space:pre-wrap;font-size:13px;color:#ccc;margin-top:10px">'+esc(item.detail)+'</div>';
    if(item.stock!==null&&item.stock!==undefined)html+='<p style="color:var(--sub);margin-top:8px">剩余库存：'+(item.stock-(item.redeemed||0))+'</p>';
    html+='<div style="margin-top:14px">';
    if(state.role==="member"||state.role==="admin")html+='<button class="btn btn-gold" onclick="redeemItem('+item.id+')">积分兑换</button>';
    else html+='<p style="color:var(--sub);text-align:center">访客无法兑换，请注册成为社团成员</p>';
    if(isAdmin())html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-ghost" onclick="editShopItem('+item.id+')">编辑</button><button class="btn btn-ghost" style="color:var(--red)" onclick="deleteShopItem('+item.id+')">删除</button></div>';
    html+='</div>';
    openModal(html);break;
  }}
}
function redeemItem(id){
  if(!confirm("确定要兑换吗？"))return;
  for(var i=0;i<DB.shop.length;i++){if(DB.shop[i].id===id){
    if(DB.shop[i].stock!==null&&DB.shop[i].stock!==undefined){
      if(DB.shop[i].stock-(DB.shop[i].redeemed||0)<=0){showToast("库存不足",true);return;}
    }
    DB.shop[i].redeemed=(DB.shop[i].redeemed||0)+1;
    saveCollection("shop").then(function(){showToast("兑换成功！");closeModal();renderShop();});
    return;
  }}
}

// ===== Shop Admin =====
function addShopItem(){
  detailImages=[];
  openModal('<h2>上架商品</h2>'+
    '<div class="form-row"><label>商品名称</label><input id="shopName"></div>'+
    '<div class="form-row"><label>所需积分</label><input id="shopPts" type="number" value="0"></div>'+
    '<div class="form-row"><label>原价（可选）</label><input id="shopPrice" placeholder="如 ¥39"></div>'+
    '<div class="form-row"><label>简短描述</label><textarea id="shopDesc"></textarea></div>'+
    '<div class="form-row"><label>宝贝详情（文字）</label><textarea id="shopDetail" style="min-height:80px"></textarea></div>'+
    '<div class="form-row"><label>库存（留空=不限）</label><input id="shopStock" type="number"></div>'+
    '<div class="form-row"><label>商品主图URL</label><input id="shopImg" placeholder="https://..."></div>'+
    '<div class="form-row"><label>或上传本地图片</label><input id="shopFile" type="file" accept="image/*" onchange="handleShopFile(event)"></div>'+
    '<div id="shopImgPreview"></div>'+
    '<div class="form-row"><label>宝贝详情图（可多张）</label><input id="detailFile" type="file" accept="image/*" multiple onchange="handleDetailFile(event)"></div>'+
    '<div id="detailImgsPreview" class="thumb-preview"></div>'+
    '<button class="btn btn-gold" onclick="submitShopItem()">发布商品</button>');
}
function handleShopFile(e){var file=e.target.files[0];if(!file)return;if(file.size>3*1024*1024){showToast("图片不能超过3MB",true);return;}var reader=new FileReader();reader.onload=function(){$("shopImg").value=reader.result;$("shopImgPreview").innerHTML='<img src="'+reader.result+'" style="width:80px;height:80px;object-fit:cover;border-radius:6px">';};reader.readAsDataURL(file);}
function handleDetailFile(e){var files=e.target.files;for(var i=0;i<files.length;i++){if(files[i].size>3*1024*1024){showToast("图片不能超过3MB",true);continue;}var reader=new FileReader();reader.onload=function(ev){detailImages.push(ev.target.result);renderDetailImgs();};reader.readAsDataURL(files[i]);}}
function renderDetailImgs(){var html="";for(var i=0;i<detailImages.length;i++)html+='<div class="thumb-item"><img src="'+detailImages[i]+'"><div class="rm" onclick="removeDetailImg('+i+')">×</div></div>';$("detailImgsPreview").innerHTML=html;}
function removeDetailImg(idx){detailImages.splice(idx,1);renderDetailImgs();}
function submitShopItem(){
  var name=$("shopName").value.trim();var pts=parseInt($("shopPts").value)||0;var price=$("shopPrice").value.trim();
  var desc=$("shopDesc").value.trim();var detail=$("shopDetail").value.trim();var img=$("shopImg").value.trim();
  var stockInput=$("shopStock").value.trim();var stock=stockInput?parseInt(stockInput):null;
  if(!name){showToast("请输入商品名称",true);return;}
  if(pts<=0){showToast("请输入有效积分",true);return;}
  var maxId=0;for(var i=0;i<DB.shop.length;i++){if(DB.shop[i].id>maxId)maxId=DB.shop[i].id;}
  var obj={id:maxId+1,name:name,points:pts,description:desc,detail:detail,img:img,redeemed:0,detail_imgs:detailImages.slice()};
  if(price)obj.price=price;if(stock!==null)obj.stock=stock;
  DB.shop.push(obj);
  saveCollection("shop").then(function(ok){if(ok){closeModal();renderShop();showToast("商品已发布");}else{showToast("发布失败，请重试",true);}});
}
function editShopItem(id){
  for(var i=0;i<DB.shop.length;i++){if(DB.shop[i].id===id){var item=DB.shop[i];detailImages=(item.detail_imgs||[]).slice();
    openModal('<h2>编辑商品</h2>'+
      '<div class="form-row"><label>商品名称</label><input id="shopName" value="'+esc(item.name)+'"></div>'+
      '<div class="form-row"><label>所需积分</label><input id="shopPts" type="number" value="'+item.points+'"></div>'+
      '<div class="form-row"><label>原价（可选）</label><input id="shopPrice" value="'+esc(item.price||"")+'"></div>'+
      '<div class="form-row"><label>简短描述</label><textarea id="shopDesc">'+esc(item.description||"")+'</textarea></div>'+
      '<div class="form-row"><label>宝贝详情（文字）</label><textarea id="shopDetail" style="min-height:80px">'+esc(item.detail||"")+'</textarea></div>'+
      '<div class="form-row"><label>库存（留空=不限）</label><input id="shopStock" type="number" value="'+(item.stock||"")+'"></div>'+
      '<div class="form-row"><label>商品主图URL</label><input id="shopImg" value="'+esc(item.img||"")+'"></div>'+
      '<div id="shopImgPreview"></div>'+
      '<div class="form-row"><label>宝贝详情图（可多张）</label><input id="detailFile" type="file" accept="image/*" multiple onchange="handleDetailFile(event)"></div>'+
      '<div id="detailImgsPreview" class="thumb-preview"></div>'+
      '<button class="btn btn-gold" onclick="submitEditShopItem('+id+')">保存修改</button>');
    renderDetailImgs();break;
  }}
}
function submitEditShopItem(id){
  var name=$("shopName").value.trim();var pts=parseInt($("shopPts").value)||0;var price=$("shopPrice").value.trim();

// ===== Activities Admin =====
function showAddActivity(){
  openModal('<h2>添加活动</h2><div class="form-row"><label>活动标题</label><input id="actTitle"></div><div class="form-row"><label>状态</label><select id="actStatus"><option value="active">进行中</option><option value="done">已结束</option></select></div><div class="form-row"><label>日期</label><input id="actDate" type="date"></div><div class="form-row"><label>地点</label><input id="actLoc"></div><div class="form-row"><label>描述</label><textarea id="actDesc"></textarea></div><button class="btn btn-gold" onclick="submitAddActivity()">添加</button>');
}
function submitAddActivity(){
  var title=$("actTitle").value.trim();if(!title){showToast("请输入标题",true);return;}
  var maxId=0;for(var i=0;i<DB.activities.length;i++){if(DB.activities[i].id>maxId)maxId=DB.activities[i].id;}
  DB.activities.push({id:maxId+1,title:title,status:$("actStatus").value,date:$("actDate").value,location:$("actLoc").value.trim(),description:$("actDesc").value.trim()});
  saveCollection("activities").then(function(ok){if(ok){closeModal();renderActivities();showToast("活动已添加");}else{showToast("添加失败",true);}});
}
function editActivity(id){
  for(var i=0;i<DB.activities.length;i++){if(DB.activities[i].id===id){var a=DB.activities[i];
    openModal('<h2>编辑活动</h2><div class="form-row"><label>活动标题</label><input id="actTitle" value="'+esc(a.title)+'"></div><div class="form-row"><label>状态</label><select id="actStatus"><option value="active"'+(a.status==="active"?" selected":"")+'>进行中</option><option value="done"'+(a.status==="done"?" selected":"")+'>已结束</option></select></div><div class="form-row"><label>日期</label><input id="actDate" type="date" value="'+esc(a.date||"")+'"></div><div class="form-row"><label>地点</label><input id="actLoc" value="'+esc(a.location||"")+'"></div><div class="form-row"><label>描述</label><textarea id="actDesc">'+esc(a.description||"")+'</textarea></div><button class="btn btn-gold" onclick="submitEditActivity('+id+')">保存</button>');
    break;
  }}
}
function submitEditActivity(id){
  for(var i=0;i<DB.activities.length;i++){if(DB.activities[i].id===id){
    DB.activities[i].title=$("actTitle").value.trim();DB.activities[i].status=$("actStatus").value;
    DB.activities[i].date=$("actDate").value;DB.activities[i].location=$("actLoc").value.trim();
    DB.activities[i].description=$("actDesc").value.trim();break;
  }}
  saveCollection("activities").then(function(){closeModal();renderActivities();showToast("已保存");});
}
function deleteActivity(id){
  if(!confirm("确定删除此活动？"))return;
  DB.activities=DB.activities.filter(function(a){return a.id!==id;});
  saveCollection("activities").then(function(){renderActivities();showToast("已删除");});

// ===== Settings =====
function renderSettings(){
  var html='<div class="settings-section"><h3>当前账号</h3><div class="item"><span>角色</span><span>'+(state.role==="admin"?"管理员":"成员")+'</span></div><div class="item"><span>用户</span><span>'+esc(state.user||"")+'</span></div><div class="item"><span>退出</span><span><button class="btn btn-ghost" style="padding:4px 12px" onclick="logout()">退出登录</button></span></div></div>';
  if(isAdmin()){
    html+='<div class="settings-section pending-list"><h3>注册审核</h3><div id="pendingRegs">加载中...</div></div>';
    html+='<div class="settings-section"><h3>修改管理员密码</h3><div class="form-row"><label>新密码</label><input id="newPass" type="password"></div><button class="btn btn-gold" onclick="submitChangePass()">修改密码</button></div>';
    html+='<div class="settings-section"><h3>社团信息</h3><div class="form-row"><label>社团名称</label><input id="setClubName" value="'+esc(DB.settings.club_name||"")+'"></div><div class="form-row"><label>社团描述</label><input id="setClubDesc" value="'+esc(DB.settings.club_desc||"")+'"></div><button class="btn btn-gold" onclick="submitClubSettings()">保存</button></div>';
  }
  $("settingsArea").innerHTML=html;
  if(isAdmin())loadPendingRegs();
}
function loadPendingRegs(){
  var regs=DB.registrations.filter(function(r){return r.status==="pending";});
  var html="";
  if(regs.length===0)html='<div style="color:var(--sub);text-align:center;padding:10px">暂无待审核注册</div>';
  else{for(var i=0;i<regs.length;i++){var r=regs[i];
    html+='<div class="pending-item"><div><div>'+esc(r.realName)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(r.username)+'</div></div><div class="acts"><button class="btn-approve" onclick="approveReg('+i+')">通过</button><button class="btn-reject" onclick="rejectReg('+i+')">拒绝</button></div></div>';
  }}
  var el=$("pendingRegs");if(el)el.innerHTML=html;
}
function approveReg(idx){
  var regs=DB.registrations.filter(function(r){return r.status==="pending";});
  var r=regs[idx];if(!r)return;
  var existing=DB.members.find(function(m){return m.name===r.realName;});
  if(existing){existing.username=r.username;existing.password=r.password;existing.role="member";}
  else{var maxId=0;for(var i=0;i<DB.members.length;i++){if(DB.members[i].id>maxId)maxId=DB.members[i].id;}
    DB.members.push({id:maxId+1,name:r.realName,username:r.username,password:r.password,role:"member",points:0});}
  var realReg=DB.registrations.find(function(reg){return reg.username===r.username&&reg.status==="pending";});
  if(realReg)realReg.status="approved";
  Promise.all([saveCollection("members"),saveCollection("registrations")]).then(function(){
    loadPendingRegs();showToast("已通过 "+r.realName+" 的注册");
  });
}
function rejectReg(idx){
  var regs=DB.registrations.filter(function(r){return r.status==="pending";});
  var r=regs[idx];if(!r)return;
  var realReg=DB.registrations.find(function(reg){return reg.username===r.username&&reg.status==="pending";});
  if(realReg)realReg.status="rejected";
  saveCollection("registrations").then(function(){loadPendingRegs();showToast("已拒绝");});
}
function submitChangePass(){var np=$("newPass").value.trim();if(!np){showToast("请输入新密码",true);return;}DB.settings.admin_pass=np;saveCollection("settings").then(function(){showToast("密码已修改");$("newPass").value="";});}
function submitClubSettings(){DB.settings.club_name=$("setClubName").value.trim();DB.settings.club_desc=$("setClubDesc").value.trim();saveCollection("settings").then(function(){showToast("已保存");});}

function openModal(html){$("modalContent").innerHTML='<span class="modal-close" onclick="closeModal()">×</span>'+html;$("modalOverlay").style.display="flex";}
function closeModal(){$("modalOverlay").style.display="none";$("modalContent").innerHTML="";}

// ===== Polling (30s refresh, per-file, no full overwrite) =====
var pollTimer=null;
async function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async function(){
    try{
      var fresh=await Promise.all([readFile("data/members.json"),readFile("data/shop.json"),readFile("data/activities.json"),readFile("data/tips.json"),readFile("data/news.json"),readFile("data/registrations.json"),readFile("data/settings.json")]);
      if(fresh[0])DB.members=fresh[0];
      if(fresh[1])DB.shop=fresh[1];
      if(fresh[2])DB.activities=fresh[2];
      if(fresh[3])DB.tips=fresh[3];
      if(fresh[4])DB.news=fresh[4];
      if(fresh[5])DB.registrations=fresh[5];
      if(fresh[6])DB.settings=fresh[6];
      if(state.currentPage)renderPage(state.currentPage);
    }catch(e){console.error("Poll error:",e);}
  },30000);
}

  await loadAllData();
  if(tryRestoreSession()){enterApp();}
})();
