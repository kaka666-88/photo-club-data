<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>留声光影 - 摄影社团</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a96e;--gold-d:#a88950;--dark:#1a1a1a;--dark2:#252525;--dark3:#333;--gray:#888;--bg:#0e0e0e;--card:#1e1e1e;--text:#e0e0e0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--gold);text-decoration:none}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:3px}

/* ===== Layout ===== */
#app{min-height:100vh;padding-bottom:60px}
.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Top Bar ===== */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(14,14,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--dark3)}
.topbar .logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--gold)}
.topbar .logo img{width:36px;height:36px;border-radius:6px;filter:drop-shadow(0 0 4px rgba(201,169,110,.3))}
.topbar .logo span{font-size:12px;color:var(--gray);font-weight:400}
.topbar .actions{display:flex;gap:8px;align-items:center}
.topbar .avatar{width:32px;height:32px;border-radius:50%;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold);border:1px solid var(--gold)}

/* ===== Bottom Nav ===== */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1000px;z-index:200;display:flex;background:rgba(14,14,14,.95);backdrop-filter:blur(10px);border-top:1px solid var(--dark3);height:56px}
.bottomnav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray);font-size:10px;cursor:pointer;transition:color .2s;-webkit-user-select:none;user-select:none}
.bottomnav .nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.bottomnav .nav-item.active{color:var(--gold)}

/* ===== Home ===== */
.hero{position:relative;height:42vh;min-height:280px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3) 0%,rgba(0,0,0,.7) 100%)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;object-fit:cover;width:100%;height:100%}
.hero-slide.active{opacity:1}
.hero-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:6px}
.hero-dots .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:background .3s}
.hero-dots .dot.active{background:var(--gold)}
.hero .hero-text{position:absolute;bottom:24px;left:0;right:0;text-align:center;z-index:2}
.hero .hero-text h1{font-size:28px;color:#fff;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hero .hero-text p{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.section{padding:16px}
.section-title{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section-title .more{font-size:12px;color:var(--gray);font-weight:400}
.stats-row{display:flex;gap:8px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:12px 8px;text-align:center}
.stat-card .num{font-size:22px;font-weight:700;color:var(--gold)}
.stat-card .label{font-size:11px;color:var(--gray);margin-top:2px}

/* ===== Gallery ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-grid .photo-card{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;cursor:pointer}
.gallery-grid .photo-card img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-grid .photo-card:hover img{transform:scale(1.05)}
.gallery-grid .photo-card .photo-info{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);font-size:11px}
.gallery-grid .photo-card .photo-info .title{color:#fff;font-weight:600}
.gallery-grid .photo-card .photo-info .author{color:rgba(255,255,255,.6)}
@media(min-width:768px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.gallery-grid{grid-template-columns:repeat(4,1fr)}}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card .card-title{font-size:15px;font-weight:600;margin-bottom:6px}
.card .card-desc{font-size:13px;color:var(--gray);line-height:1.5}
.card .card-meta{display:flex;gap:12px;font-size:11px;color:var(--gray);margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:rgba(201,169,110,.15);color:var(--gold)}
.tag.status-active{background:rgba(76,175,80,.15);color:#4caf50}
.tag.status-done{background:rgba(158,158,158,.15);color:#9e9e9e}
.tag.status-upcoming{background:rgba(255,152,0,.15);color:#ff9800}

/* ===== Members ===== */
.member-list{display:flex;flex-direction:column;gap:8px}
.member-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:12px}
.member-item .m-avatar{width:40px;height:40px;border-radius:50%;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);flex-shrink:0}
.member-item .m-info{flex:1}
.member-item .m-info .m-name{font-size:14px;font-weight:600}
.member-item .m-info .m-role{font-size:11px;color:var(--gray)}
.member-item .m-points{font-size:16px;font-weight:700;color:var(--gold)}
.member-item .m-del{color:#f44336;font-size:12px;cursor:pointer;padding:4px 8px}

/* ===== Points ===== */
.points-table{width:100%;border-collapse:collapse;font-size:13px}
.points-table th{text-align:left;padding:8px;color:var(--gray);font-weight:400;border-bottom:1px solid var(--dark3)}
.points-table td{padding:8px;border-bottom:1px solid var(--dark2)}

/* ===== Tips ===== */
.tip-item{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.tip-item .tip-cat{font-size:11px;color:var(--gold);margin-bottom:4px}
.tip-item .tip-title{font-size:15px;font-weight:600;margin-bottom:6px}
.tip-item .tip-content{font-size:13px;color:#bbb;line-height:1.6;white-space:pre-line}
.tip-item .tip-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

/* ===== News ===== */
.news-item{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;gap:12px}
.news-item .news-text{flex:1}
.news-item .news-title{font-size:14px;font-weight:600;margin-bottom:4px}
.news-item .news-summary{font-size:12px;color:var(--gray);line-height:1.5}
.news-item .news-meta{font-size:10px;color:var(--gray);margin-top:6px}
.news-item .news-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0}

/* ===== Activities ===== */
.act-item{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.act-item .act-banner{height:140px;object-fit:cover;width:100%}
.act-item .act-body{padding:14px}
.act-item .act-title{font-size:15px;font-weight:600;margin-bottom:4px}
.act-item .act-desc{font-size:13px;color:var(--gray);line-height:1.5}
.act-item .act-meta{display:flex;gap:12px;font-size:11px;color:var(--gray);margin-top:8px;flex-wrap:wrap}

/* ===== Forms ===== */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--gray);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--dark2);border:1px solid var(--dark3);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px}
.form-group textarea{resize:vertical;min-height:80px}
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-gold{background:var(--gold);color:#1a1a1a}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-red{background:transparent;color:#f44336;border:1px solid #f44336}
.btn-sm{padding:6px 12px;font-size:12px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:16px}
.modal .modal-close{float:right;font-size:22px;color:var(--gray);cursor:pointer;line-height:1}

/* ===== Login ===== */
.login-screen{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#0e0e0e}
.login-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.login-bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.65)}
.login-box{position:relative;z-index:2;text-align:center;padding:24px;width:100%;max-width:360px}
.login-box h1{font-size:32px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.login-box .sub{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:32px}
.login-box .form-group{text-align:left}
.login-box .form-group input{background:rgba(255,255,255,.08);border:1px solid rgba(201,169,110,.3);color:#fff}
.login-box .form-group input::placeholder{color:rgba(255,255,255,.4)}
.login-box .btn-gold{width:100%;margin-top:8px}
.login-box .guest-btn{margin-top:12px;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer}
.login-box .err-msg{color:#ff6b6b;font-size:12px;margin-top:8px;min-height:16px}

/* ===== Toast ===== */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--dark3);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.error{background:#d32f2f}

/* ===== Empty ===== */
.empty{text-align:center;padding:40px 16px;color:var(--gray);font-size:14px}

/* ===== Settings ===== */
.set-section{margin-bottom:16px}
.set-section h4{font-size:13px;color:var(--gray);margin-bottom:8px;padding:0 4px}
.set-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:8px;padding:12px 16px;margin-bottom:6px}
.set-item .set-label{font-size:14px}
.set-item .set-value{font-size:13px;color:var(--gray)}

/* ===== Upload ===== */
.upload-area{border:2px dashed var(--dark3);border-radius:8px;padding:24px;text-align:center;color:var(--gray);font-size:13px;cursor:pointer;transition:border-color .2s}
.upload-area:hover{border-color:var(--gold)}
.upload-area input{display:none}

/* ===== Responsive ===== */
@media(min-width:768px){
  .section{max-width:800px;margin:0 auto}
  .topbar{max-width:800px;margin:0 auto;left:0;right:0}
}
@media(min-width:1024px){
  .section{max-width:1000px}
  .topbar{max-width:1000px}
}
</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div id="loginScreen" class="login-screen">
  <div id="loginBg" class="login-bg"></div>
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png?v=7" alt="留声光影" style="width:107px;height:107px;border-radius:14px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 10px rgba(201,169,110,.5))">
    <h1>留声光影</h1>
    <p class="sub">用镜头记录世界，用光影讲述故事</p>
    <div class="form-group">
      <input id="loginUser" placeholder="账号" autocomplete="username" style="margin-bottom:8px">
    </div>
    <div class="form-group">
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <div id="loginErr" class="err-msg"></div>
    <button class="btn btn-gold" onclick="adminLoginSubmit()">管理员登录</button>
    <div class="guest-btn" onclick="doGuestLogin()">访客浏览</div>
  </div>
</div>

<!-- ===== Main App ===== -->
<div id="app" style="display:none">

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">留声光影 <span>摄影社团</span></div>
  <div class="actions">
    <div class="avatar" id="userAvatar">访</div>
  </div>
</div>

<!-- ===== Home Page ===== -->
<div id="page-home" class="page active">
  <div class="hero" id="heroCarousel">
    <div id="heroSlides" style="position:absolute;inset:0"></div>
    <div class="hero-text">
      <img src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png?v=6" alt="留声光影" style="width:144px;height:144px;border-radius:18px;margin:0 auto 8px;display:block;filter:drop-shadow(0 0 10px rgba(201,169,110,.5))">
      <h1>留声光影</h1>
      <p>用镜头记录世界，用光影讲述故事</p>
    </div>
    <div id="heroDots" class="hero-dots"></div>
    <div id="heroAdmin" style="display:none;position:absolute;top:12px;right:12px;z-index:5;display:flex;gap:8px">
      <button class="btn btn-gold btn-sm" onclick="showUploadHero()">上传轮播图</button>
      <button class="btn btn-ghost btn-sm" onclick="showDeleteHero()" style="background:rgba(0,0,0,.5);color:#fff">删除</button>
    </div>
  </div>
  <div class="section">
    <div class="stats-row" id="statsRow"></div>
    <div class="section-title">社团简介</div>
    <div class="card" id="aboutCard"></div>
    <div class="section-title">精选作品 <span class="more" onclick="switchPage('gallery')">查看全部 ></span></div>
    <div class="gallery-grid" id="homeGallery"></div>
    <div class="section-title">最新活动 <span class="more" onclick="switchPage('activities')">查看全部 ></span></div>
    <div id="homeActivities"></div>
    <div class="section-title">摄影资讯 <span class="more" onclick="switchPage('news')">查看全部 ></span></div>
    <div id="homeNews"></div>
  </div>
</div>

<!-- ===== Gallery Page ===== -->
<div id="page-gallery" class="page">
  <div class="section">
    <div class="section-title">作品展示</div>
    <div class="gallery-grid" id="fullGallery"></div>
  </div>
</div>

<!-- ===== Members Page ===== -->
<div id="page-members" class="page">
  <div class="section">
    <div class="section-title">
      社团成员
      <span id="addMemberBtn" style="display:none">
        <button class="btn btn-gold btn-sm" onclick="showAddMember()">+ 添加</button>
      </span>
    </div>
    <div class="member-list" id="memberList"></div>
  </div>
</div>

<!-- ===== Points Page ===== -->
<div id="page-points" class="page">
  <div class="section">
    <div class="section-title">
      积分排行
      <span id="uploadPointsBtn" style="display:none">
        <button class="btn btn-gold btn-sm" onclick="showUploadPoints()">上传明细</button>
      </span>
    </div>
    <div id="pointsRanking"></div>
    <div class="section-title" style="margin-top:16px">积分明细</div>
    <div id="pointsDetail"></div>
  </div>
</div>

<!-- ===== Tips Page ===== -->
<div id="page-tips" class="page">
  <div class="section">
    <div class="section-title">摄影技巧</div>
    <div id="tipsList"></div>
  </div>
</div>

<!-- ===== News Page ===== -->
<div id="page-news" class="page">
  <div class="section">
    <div class="section-title">摄影资讯</div>
    <div id="newsList"></div>
  </div>
</div>

<!-- ===== Activities Page ===== -->
<div id="page-activities" class="page">
  <div class="section">
    <div class="section-title">
      社团活动
      <span id="addActivityBtn" style="display:none">
        <button class="btn btn-gold btn-sm" onclick="showAddActivity()">+ 发布</button>
      </span>
    </div>
    <div id="activitiesList"></div>
  </div>
</div>

<!-- ===== Settings Page ===== -->
<div id="page-settings" class="page">
  <div class="section">
    <div class="section-title">设置</div>
    <div class="set-section">
      <h4>账号</h4>
      <div class="set-item">
        <span class="set-label">当前身份</span>
        <span class="set-value" id="setRole">访客</span>
      </div>
    </div>
    <div class="set-section" id="settingsAdmin" style="display:none">
      <h4>管理设置</h4>
      <div class="set-item">
        <span class="set-label">社团名称</span>
        <span class="set-value" id="setClubName">-</span>
      </div>
      <div class="set-item">
        <span class="set-label">修改密码</span>
        <button class="btn btn-ghost btn-sm" onclick="showChangePass()">修改</button>
      </div>
      <div class="set-item">
        <span class="set-label">GitHub Token</span>
        <button class="btn btn-ghost btn-sm" onclick="showSetToken()">设置</button>
      </div>
      <div class="set-item">
        <span class="set-label">手动同步</span>
        <button class="btn btn-ghost btn-sm" onclick="manualSync()">同步</button>
      </div>
    </div>
    <div class="set-section">
      <button class="btn btn-ghost" style="width:100%" onclick="logout()">退出登录</button>
    </div>
  </div>
</div>

<!-- ===== Shop Page ===== -->
<div id="page-shop" class="page">
  <div class="section">
    <div class="section-title">周边商城</div>
    <div id="shopGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"></div>
  </div>
</div>

</div><!-- /app -->

<!-- ===== Bottom Nav ===== -->
<div id="bottomNav" class="bottomnav" style="display:none">
  <div class="nav-item active" data-page="home" onclick="switchPage('home')">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h4v-6h6v6h4V10"/></svg>
    <span>首页</span>
  </div>
  <div class="nav-item" data-page="gallery" onclick="switchPage('gallery')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <span>作品</span>
  </div>
  <div class="nav-item" data-page="members" onclick="switchPage('members')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>成员</span>
  </div>
  <div class="nav-item" data-page="activities" onclick="switchPage('activities')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>活动</span>
  </div>
  <div class="nav-item" data-page="points" onclick="switchPage('points')">
    <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
    <span>积分</span>
  </div>
  <div class="nav-item" data-page="tips" onclick="switchPage('tips')">
    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <span>技巧</span>
  </div>
  <div class="nav-item" data-page="news" onclick="switchPage('news')">
    <svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2"/><path d="M4 22V4a2 2 0 0 1 2-2"/><circle cx="12" cy="12" r="2"/><path d="M12 10v8M10 12h4"/></svg>
    <span>资讯</span>

function showToast(msg, isErr){

  t.className='toast show'+(isErr?' error':'');
  setTimeout(function(){t.className='toast';},3000);

// ===== Cloud API =====
var API = {
  _data: null,
  _nextId: 1,
  _remoteSha: null,
  _pollTimer: null,
  _writeTimer: null,
  _savingFromRemote: false,
  _skipNextSync: false,
  _lastSync: 0,

  _isConfigured: function(){
    var c=this.ghCfg();
    return c&&c.owner&&c.repo;
  },
  _hasToken: function(){
    var c=this.ghCfg();
    return !!(c&&c.token);
  },
  ghCfg: function(){
    try{var c=JSON.parse(localStorage.getItem('photoClubGithub')||'{}');return c;}catch(e){return {};}
  },
  _apiUrl: function(){
    var c=this.ghCfg();
    return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/data.json';
  },
  _rawUrl: function(){
    var c=this.ghCfg();
    return 'https://raw.githubusercontent.com/'+c.owner+'/'+c.repo+'/'+c.branch+'/data.json?t='+Date.now();
  },
  _encodeBase64: function(str){
    return btoa(unescape(encodeURIComponent(str)));
  },
  _decodeBase64: function(b64){
    return decodeURIComponent(escape(atob(b64)));
  },

  _init: function(){
    var saved=localStorage.getItem('photoClubData');
    if(saved){
      try{this._data=JSON.parse(saved);}catch(e){this._data=null;}
    }
    if(!this._data){
      this._data=JSON.parse(JSON.stringify(SEED_DATA));
      this._saveLocal();
    }
    // Save cloud config
    if(!localStorage.getItem('photoClubGithub')){
      localStorage.setItem('photoClubGithub',JSON.stringify(CLOUD_CONFIG));
    }
    // Start polling
    this._startPoll();
  },

  _saveLocal: function(){
    localStorage.setItem('photoClubData',JSON.stringify(this._data));
  },

  _save: function(){
    this._saveLocal();
    if(this._savingFromRemote)return;
    this._scheduleWrite();
  },

  _scheduleWrite: function(){
    var self=this;
    if(this._writeTimer)clearTimeout(this._writeTimer);
    this._writeTimer=setTimeout(function(){self._writeRemote();},2000);
  },

  _startPoll: function(){
    var self=this;
    if(this._pollTimer)clearInterval(this._pollTimer);
    this._pollTimer=setInterval(function(){self._syncFromRemote();},30000);
    // Initial sync
    setTimeout(function(){self._syncFromRemote();},1000);
  },

  _syncFromRemote: async function(){
    if(this._skipNextSync){this._skipNextSync=false;this._lastSync=Date.now();return false;}
    if(!this._isConfigured())return false;
    try{
      var r=await this._readRemote();
      if(!r)return false;
      var ls=this._data.sessions||{};
      var localMembers=this._data.members||[];
      var remoteMembers=r.members||[];
      var mergedMembers=[];
      var seenNames={};
      var i;
      for(i=0;i<remoteMembers.length;i++){
        mergedMembers.push(remoteMembers[i]);
        seenNames[remoteMembers[i].name]=true;
      }
      for(i=0;i<localMembers.length;i++){
        if(!seenNames[localMembers[i].name]){
          mergedMembers.push(localMembers[i]);
          seenNames[localMembers[i].name]=true;
        }
      }
      r.members=mergedMembers;
      r.sessions=ls;
      var all=[].concat(r.members||[],r.activities||[],r.knowledge||[],r.news||[],r.tips||[]);
      var maxId=0;
      for(i=0;i<all.length;i++){if(all[i].id>maxId)maxId=all[i].id;}
      this._nextId=maxId+1;
      this._data=r;
      this._savingFromRemote=true;
      this._saveLocal();
      this._savingFromRemote=false;
      this._lastSync=Date.now();
      if(state.role&&typeof renderPage==='function'){renderPage(state.currentPage);}
      return true;
    }catch(e){console.error('Sync error:',e);return false;}
  },

  _readRemote: async function(){
    if(!this._isConfigured())return null;
    try{
      var text;
      if(this._hasToken()){
        var c=this.ghCfg();
        var r=await fetch(this._apiUrl()+'?ref='+c.branch+'&t='+Date.now(),{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json'}});
        if(!r.ok)return null;
        var fd=await r.json();
        text=this._decodeBase64(fd.content.replace(/\n/g,''));
        this._remoteSha=fd.sha;
      }else{
        var r2=await fetch(this._rawUrl());
        if(!r2.ok)return null;
        text=await r2.text();
      }
      if(!text||text.trim().startsWith('<'))return null;
      return JSON.parse(text);
    }catch(e){return null;}
  },

  _writeRemote: async function(){
    if(!this._isConfigured())return false;
    if(!this._hasToken()){console.warn('No token');return false;}
    var c=this.ghCfg();
    try{
      var sha=null;
      try{
        var gr=await fetch(this._apiUrl(),{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var fd=await gr.json();sha=fd.sha;this._remoteSha=sha;}
      }catch(e){}
      var d=JSON.parse(JSON.stringify(this._data));
      delete d.sessions;
      var content=this._encodeBase64(JSON.stringify(d,null,2));
      var body=JSON.stringify({message:'Update '+new Date().toISOString(),content:content,sha:sha||undefined,branch:c.branch});
      var pr=await fetch(this._apiUrl(),{method:'PUT',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:body});
      if(pr.ok){var res=await pr.json();this._remoteSha=res.content.sha;this._skipNextSync=true;this._lastSync=Date.now();return true;}
      var et=await pr.text();console.error('Write failed:',pr.status,et);showToast('\u540c\u6b65\u5931\u8d25:'+pr.status,true);return false;
    }catch(e){console.error('Write error:',e);return false;}
  },

  // ===== Auth =====
  adminLogin: function(u,p){
    var s=this._data.settings;
    if(u===s.admin_user&&p===s.admin_pass){
      var token='admin_'+Date.now();
      this._data.sessions=this._data.sessions||{};
      this._data.sessions[token]={user:u,role:'admin',ts:Date.now()};
      this._save();
      return Promise.resolve({user:u,token:token});
    }
    return Promise.reject(new Error('\u8d26\u53f7\u6216\u5bc6\u7801\u9519\u8bef'));
  },

  guestLogin: function(){
    var token='guest_'+Date.now();
    this._data.sessions=this._data.sessions||{};
    this._data.sessions[token]={user:'\u8bbf\u5ba2',role:'guest',ts:Date.now()};
    this._save();
    return Promise.resolve({user:'\u8bbf\u5ba2',token:token});
  },

  // ===== Members =====
  getMembers: function(){return this._data.members||[];},
  addMember: function(name,role){
    var m={id:this._nextId++,name:name,role:role,points:0};
    this._data.members=this._data.members||[];
    this._data.members.push(m);
    this._saveLocal();
    var self=this;
    this._writeRemote().then(function(ok){
      if(!ok){showToast('\u540c\u6b65\u5931\u8d25\uff0c\u8bf7\u5728\u8bbe\u7f6e\u4e2d\u914d\u7f6eGitHub Token',true);}
    });
    return m;
  },
  deleteMember: function(id){
    this._data.members=(this._data.members||[]).filter(function(m){return m.id!==id;});
    this._saveLocal();this._writeRemote();
  },

  // ===== Points =====
  getPointsRanking: function(){
    var members=(this._data.members||[]).slice();
    members.sort(function(a,b){return (b.points||0)-(a.points||0);});
    return members;
  },
  getPointsHistory: function(){return this._data.pointsHistory||[];},
  addPointsBatch: function(records){
    this._data.pointsHistory=this._data.pointsHistory||[];
    var self=this;
    records.forEach(function(r){
      r.id=self._nextId++;
      self._data.pointsHistory.push(r);
      var m=(self._data.members||[]).find(function(x){return x.name===r.name;});
      if(m){m.points=(m.points||0)+(r.points||0);}
    });
    this._saveLocal();this._writeRemote();
  },

  // ===== Activities =====
  getActivities: function(){return this._data.activities||[];},
  addActivity: function(act){
    act.id=this._nextId++;
    this._data.activities=this._data.activities||[];
    this._data.activities.unshift(act);
    this._saveLocal();this._writeRemote();
    return act;
  },
  updateActivity: function(id,updates){
    var acts=this._data.activities||[];
    for(var i=0;i<acts.length;i++){
      if(acts[i].id===id){Object.assign(acts[i],updates);break;}
    }
    this._saveLocal();this._writeRemote();
  },

  // ===== Knowledge/Tips =====
  getKnowledge: function(){return this._data.knowledge||[];},
  getTips: function(){return this._data.tips||[];},

  // ===== News =====
  getNews: function(){return this._data.news||[];},
  addNews: function(item){
    item.id=this._nextId++;
    item.created_at=new Date().toISOString();
    this._data.news=this._data.news||[];
    this._data.news.unshift(item);
    if(this._data.news.length>50)this._data.news=this._data.news.slice(0,50);
    this._saveLocal();this._writeRemote();
  },

  // ===== Settings =====
  saveSettings: function(updates){
    var s=this._data.settings;
    if(updates.admin_pass)s.admin_pass=updates.admin_pass;
    if(updates.club_name)s.club_name=updates.club_name;
    if(updates.club_desc!==undefined)s.club_desc=updates.club_desc;
    this._saveLocal();this._writeRemote();
    return Promise.resolve({message:'\u8bbe\u7f6e\u5df2\u4fdd\u5b58'});
  },

  saveGithubToken: function(token){
    var cfg=this.ghCfg();
    cfg.token=token;
    localStorage.setItem('photoClubGithub',JSON.stringify(cfg));
    return Promise.resolve({message:'Token\u5df2\u4fdd\u5b58'});
  }
};

// ===== Store (data access wrapper) =====
var store = {
  get data(){return API._data;}
};

// ===== Session =====
function saveSession(){
  if(state.token){
    localStorage.setItem('photoClubSession',JSON.stringify({token:state.token,user:state.user,role:state.role}));
  }
}
function clearSession(){
  localStorage.removeItem('photoClubSession');
}
function tryRestoreSession(){
  var saved=localStorage.getItem('photoClubSession');
  if(!saved)return Promise.resolve(false);
  try{
    var sess=JSON.parse(saved);
    var sessions=API._data.sessions||{};
    var info=sessions[sess.token];
    if(info){
      state.role=info.role;
      state.user=info.user;
      state.token=sess.token;
      return Promise.resolve(true);
    }
    // Try admin auto-login with remembered credentials
    var au=localStorage.getItem('photoClubAdminUser');
    var ap=localStorage.getItem('photoClubAdminPass');
    if(au&&ap){
      return API.adminLogin(au,ap).then(function(r){
        state.role='admin';state.user=r.user;state.token=r.token;
        saveSession();
        return true;
      }).catch(function(){return false;});
    }
  }catch(e){}
  return Promise.resolve(false);
}

// ===== Login =====
function adminLoginSubmit(){
  var u=$('loginUser').value.trim();
  var p=$('loginPass').value.trim();
  if(!u||!p){showToast('\u8bf7\u8f93\u5165\u8d26\u53f7\u548c\u5bc6\u7801',true);return;}
  API.adminLogin(u,p).then(function(r){
    state.role='admin';state.user=r.user;state.token=r.token;
    localStorage.setItem('photoClubAdminUser',u);
    localStorage.setItem('photoClubAdminPass',p);
    saveSession();
    enterApp();
  }).catch(function(e){showToast(e.message,true);});
}

function doGuestLogin(){
  API.guestLogin().then(function(r){
    state.role='guest';state.user=r.user;state.token=r.token;
    saveSession();
    enterApp();
  });
}

function enterApp(){
  $('loginScreen').style.display='none';
  $('app').style.display='block';
  $('bottomNav').style.display='flex';
  // Update avatar
  $('userAvatar').textContent=state.user?state.user.charAt(0):'?';

    var btns=document.querySelectorAll('[id$="Btn"]');
    btns.forEach(function(b){b.style.display='inline';});
    $('settingsAdmin').style.display='block';
    $('setRole').textContent='\u7ba1\u7406\u5458 '+state.user;
    $('setClubName').textContent=API._data.settings.club_name||'-';
  }else{
    $('setRole').textContent='\u8bbf\u5ba2';
  }

  renderPage('home');
}

function logout(){
  clearSession();
  localStorage.removeItem('photoClubAdminUser');
  localStorage.removeItem('photoClubAdminPass');
  state.role=null;state.user=null;state.token=null;
  $('app').style.display='none';
  $('bottomNav').style.display='none';
  $('loginScreen').style.display='flex';
  $('loginUser').value='';
  $('loginPass').value='';

// ===== Navigation =====
function switchPage(page){
  state.currentPage=page;
  // Update nav
  var items=document.querySelectorAll('.nav-item');
  items.forEach(function(it){
    it.classList.toggle('active',it.getAttribute('data-page')===page);
  });
  // Update pages
  var pages=document.querySelectorAll('.page');
  pages.forEach(function(p){
    p.classList.toggle('active',p.id==='page-'+page);
  });
  renderPage(page);
  window.scrollTo(0,0);
}

// ===== Render Functions =====
function renderPage(page){
  switch(page){
    case 'home':renderHome();break;
    case 'gallery':renderGallery();break;
    case 'members':renderMembers();break;
    case 'points':renderPoints();break;
    case 'tips':renderTips();break;
    case 'news':renderNews();break;
    case 'activities':renderActivities();break;
    case 'shop':renderShop();break;
  case 'settings':renderSettings();break;
  }
}

// ===== Hero Carousel =====
var heroSlides = [];
var heroTimer = null;
var heroIdx = 0;

function initHeroCarousel(){
  var saved = localStorage.getItem('heroSlides_v6');
  if(saved){
    try{heroSlides = JSON.parse(saved);}catch(e){heroSlides = [];}
  }
  if(!heroSlides.length){
    heroSlides = BG_PHOTOS.slice(0, 4);
  }
  renderHeroSlides();
  startHeroTimer();
}

function renderHeroSlides(){
  var container = $('heroSlides');
  var dots = $('heroDots');
  if(!container) return;
  var html = '';
  for(var i = 0; i < heroSlides.length; i++){
    html += '<img class="hero-slide' + (i === heroIdx ? ' active' : '') + '" src="' + photoUrl(heroSlides[i]) + '" alt="" loading="lazy">';
  }
  container.innerHTML = html;
  var dotsHtml = '';
  for(var j = 0; j < heroSlides.length; j++){
    dotsHtml += '<div class="dot' + (j === heroIdx ? ' active' : '') + '" onclick="goHeroSlide(' + j + ')"></div>';
  }
  dots.innerHTML = dotsHtml;
  // Show admin controls
  if(isAdmin()){
    $('heroAdmin').style.display = 'flex';
  }else{
    $('heroAdmin').style.display = 'none';
  }
}

function startHeroTimer(){
  if(heroTimer) clearInterval(heroTimer);
  heroTimer = setInterval(function(){
    heroIdx = (heroIdx + 1) % heroSlides.length;
    updateHeroSlide();
  }, 5000);
}

function updateHeroSlide(){
  var slides = document.querySelectorAll('.hero-slide');
  var dots = document.querySelectorAll('.hero-dots .dot');
  for(var i = 0; i < slides.length; i++){
    if(slides[i]) slides[i].classList.toggle('active', i === heroIdx);
    if(dots[i]) dots[i].classList.toggle('active', i === heroIdx);
  }
}

function goHeroSlide(idx){
  heroIdx = idx;
  updateHeroSlide();
  startHeroTimer();
}

function showUploadHero(){
  openModal('<h3>上传轮播图 <span class="modal-close" onclick="closeModal()">&times;</span></h3>' +
    '<div class="form-group"><label>图片URL</label><input id="heroUrl" placeholder="粘贴图片URL或从下方选择"></div>' +
    '<p style="font-size:12px;color:var(--gray);margin-bottom:8px">或从已有作品中选择：</p>' +
    '<div id="heroPhotoPicker" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:300px;overflow-y:auto"></div>' +
    '<button class="btn btn-gold" style="width:100%;margin-top:12px" onclick="submitAddHero()">添加</button>');
  var picker = $('heroPhotoPicker');
  var html = '';
  for(var i = 0; i < PHOTOS.length; i++){
    html += '<div style="cursor:pointer;border:2px solid transparent;border-radius:8px;overflow:hidden" onclick="document.getElementById(\'heroUrl\').value=PHOTOS[' + i + '].url;this.parentElement.querySelectorAll(\'div\').forEach(function(d){d.style.border=\'2px solid transparent\'});this.style.border=\'2px solid var(--gold)\'"><img src="' + photoUrl(PHOTOS[i].url) + '" style="width:100%;height:60px;object-fit:cover" loading="lazy"></div>';
  }
  picker.innerHTML = html;
}

function submitAddHero(){
  var url = $('heroUrl').value.trim();
  if(!url){showToast('请选择或输入图片URL', true); return;}
  heroSlides.push(url);
  localStorage.setItem('heroSlides_v6', JSON.stringify(heroSlides));
  closeModal();
  renderHeroSlides();
  showToast('轮播图已添加');
}

function showDeleteHero(){
  if(heroSlides.length <= 1){showToast('至少保留一张轮播图', true); return;}
  var html = '<h3>删除轮播图 <span class="modal-close" onclick="closeModal()">&times;</span></h3>';
  for(var i = 0; i < heroSlides.length; i++){
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;background:var(--dark2);border-radius:8px">' +
      '<img src="' + photoUrl(heroSlides[i]) + '" style="width:60px;height:40px;object-fit:cover;border-radius:4px">' +
      '<span style="flex:1;font-size:13px">轮播图 ' + (i+1) + '</span>' +
      '<button class="btn btn-red btn-sm" onclick="deleteHeroSlide(' + i + ')">删除</button>' +
      '</div>';
  }
  openModal(html);
}

function deleteHeroSlide(idx){
  heroSlides.splice(idx, 1);
  localStorage.setItem('heroSlides_v6', JSON.stringify(heroSlides));
  if(heroIdx >= heroSlides.length) heroIdx = 0;
  closeModal();
  renderHeroSlides();
  showToast('轮播图已删除');
}

function renderHome(){
  // Hero carousel handled by initHeroCarousel
  // Stats
  var members=API.getMembers();
  var acts=API.getActivities();
  var photos=PHOTOS.length;
  $('statsRow').innerHTML=
    '<div class="stat-card"><div class="num">'+members.length+'</div><div class="label">\u6210\u5458</div></div>'+
    '<div class="stat-card"><div class="num">'+acts.length+'</div><div class="label">\u6d3b\u52a8</div></div>'+
    '<div class="stat-card"><div class="num">'+photos+'</div><div class="label">\u4f5c\u54c1</div></div>';

function renderMembers(){

      '<div class="m-avatar">'+esc(m.name.charAt(0))+'</div>'+

function renderPoints(){
  var ranking=API.getPointsRanking();
  var html=ranking.map(function(m,i){
    var medal=i===0?'\ud83e\udd47':i===1?'\ud83e\udd48':i===2?'\ud83e\udd49':(i+1);
    return '<div class="member-item">'+
      '<div class="m-avatar">'+medal+'</div>'+
      '<div class="m-info"><div class="m-name">'+esc(m.name)+'</div><div class="m-role">'+esc(m.role)+'</div></div>'+
      '<div class="m-points">'+(m.points||0)+'</div>'+
      '</div>';
  }).join('');
  $('pointsRanking').innerHTML=html||'<div class="empty">\u6682\u65e0\u6392\u884c</div>';
  // Detail
  var hist=API.getPointsHistory();
  if(!hist.length){
    $('pointsDetail').innerHTML='<div class="empty">\u6682\u65e0\u79ef\u5206\u660e\u7ec6</div>';
    return;
  }
  html='<table class="points-table"><tr><th>\u59d3\u540d</th><th>\u79ef\u5206</th><th>\u539f\u56e0</th><th>\u65e5\u671f</th></tr>';
  hist.slice().reverse().forEach(function(r){
    html+='<tr><td>'+esc(r.name)+'</td><td>'+(r.points||0)+'</td><td>'+esc(r.reason||'-')+'</td><td>'+(r.date||'-')+'</td></tr>';
  });
  html+='</table>';
  $('pointsDetail').innerHTML=html;
}

function renderTips(){
  var tips=API.getTips();
  var knowledge=API.getKnowledge();
  var all=knowledge.concat(tips);
  if(!all.length){$('tipsList').innerHTML='<div class="empty">\u6682\u65e0\u5185\u5bb9</div>';return;}
  var html=all.map(function(t){
    var tags=(t.tags||'').split(',').filter(Boolean).map(function(tag){return '<span class="tag">'+esc(tag)+'</span>';}).join('');
    return '<div class="tip-item">'+
      '<div class="tip-cat">'+esc(t.category||'')+'</div>'+
      '<div class="tip-title">'+esc(t.title)+'</div>'+
      '<div class="tip-content">'+esc(t.content)+'</div>'+
      '<div class="tip-tags">'+tags+'</div>'+
      '</div>';
  }).join('');
  $('tipsList').innerHTML=html;
}

function renderNews(){
  var news=API.getNews();
  if(!news.length){$('newsList').innerHTML='<div class="empty">\u6682\u65e0\u8d44\u8baf\uff0c\u6444\u5f71\u8d44\u8baf\u4f1a\u81ea\u52a8\u66f4\u65b0</div>';return;}
  var html=news.map(function(n){return renderNewsCard(n);}).join('');
  $('newsList').innerHTML=html;
}

function renderNewsCard(n){
  var thumb=n.image?'<img class="news-thumb" src="'+esc(n.image)+'" alt="" loading="lazy">':'';
  return '<div class="news-item">'+thumb+
    '<div class="news-text">'+
    '<div class="news-title">'+esc(n.title)+'</div>'+
    '<div class="news-summary">'+esc(n.summary||'')+'</div>'+
    '<div class="news-meta">'+esc(n.source||'')+' \xb7 '+(n.created_at?new Date(n.created_at).toLocaleDateString('zh-CN'):'')+'</div>'+
    (n.url?'<a href="'+esc(n.url)+'" target="_blank">\u67e5\u770b\u539f\u6587 ></a>':'')+
    '</div></div>';
}

function renderActivities(){
  var acts=API.getActivities();
  if(!acts.length){$('activitiesList').innerHTML='<div class="empty">\u6682\u65e0\u6d3b\u52a8</div>';return;}
  var html=acts.map(function(a){return renderActivityCard(a);}).join('');
  $('activitiesList').innerHTML=html;
}

function renderActivityCard(a){
  var statusMap={upcoming:'\u5f85\u5f00\u59cb',active:'\u8fdb\u884c\u4e2d',done:'\u5df2\u7ed3\u675f'};
  var statusClass={upcoming:'status-upcoming',active:'status-active',done:'status-done'};
  var editBtn=isAdmin()?'<button class="btn btn-ghost btn-sm" style="float:right" onclick="editActivity('+a.id+')">\u7f16\u8f91</button>':'';
  return '<div class="act-item">'+
    '<div class="act-body">'+
    '<div class="act-title">'+esc(a.title)+editBtn+'</div>'+
    '<div class="act-desc">'+esc(a.desc)+'</div>'+
    '<div class="act-meta">'+
    '<span class="tag '+statusClass[a.status]+'">'+statusMap[a.status]+'</span>'+
    (a.date?'<span>\ud83d\udcc5 '+a.date+'</span>':'')+
    (a.location?'<span>\ud83d\udccd '+esc(a.location)+'</span>':'')+
    '</div></div></div>';
}

  }

    }
    html+='<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:8px 12px">';
    html+='<span style="color:var(--gold);font-size:18px;font-weight:700">'+it.points+' \u79ef\u5206</span>';
    if(it.price){
      html+='<span style="color:rgba(255,255,255,.5);font-size:12px;text-decoration:line-through;margin-left:8px">\u00a5'+it.price+'</span>';

    html+='<span style="font-size:12px;color:var(--gold)">\u67e5\u770b\u8be6\u60c5 \u203a</span>';

    html+='<div style="font-size:48px;margin-bottom:12px;opacity:.3">\u{1F6D2}</div>';

    if(isAdmin()){html+='<div style="margin-top:8px;font-size:12px;color:var(--gold)">\u70b9\u51fb\u4e0a\u65b9\u201c\u4e0a\u4f20\u5546\u54c1\u201d\u6dfb\u52a0</div>';}

  openModal('<h3>\u5546\u54c1\u8be6\u60c5 <span class="modal-close" onclick="closeModal()">\u00d7</span></h3>'+html);

function redeemItem(idx){
  var items=API._data.shop||[];if(!items[idx])return;
  var item=items[idx];
  var mem=API.getMembers();var found=null;
  for(var i=0;i<mem.length;i++){if(mem[i].name===state.user){found=mem[i];break;}}
  if(!found){showToast('\u8bf7\u5148\u767b\u5f55',true);return;}
  var pts=found.points||0;
  if(pts<item.points){showToast('\u79ef\u5206\u4e0d\u8db3\uff0c\u9700'+item.points+'\u79ef\u5206',true);return;}
  if(item.stock!==undefined&&item.stock!==null&&item.stock<=0){showToast('\u5e93\u5b58\u4e0d\u8db3',true);return;}
  if(!confirm('\u786e\u8ba4\u5151\u6362\u300c'+item.name+'\u300d\uff1f\u6d88\u8017'+item.points+'\u79ef\u5206'))return;
  found.points=pts-item.points;
  if(!API._data.pointsHistory)API._data.pointsHistory=[];
  API._data.pointsHistory.push({name:state.user,action:'\u5151\u6362:'+item.name,points:-item.points,date:new Date().toLocaleDateString()});
  if(item.redeemed===undefined)item.redeemed=0;
  item.redeemed++;
  if(item.stock!==undefined&&item.stock!==null)item.stock--;
  API._saveLocal();API._writeRemote();
  closeModal();renderShop();renderPoints();
  showToast('\u5151\u6362\u6210\u529f');
}

  body+='<div style="margin-bottom:8px">';

  body+='<div class="form-group"><label>\u5546\u54c1\u540d\u79f0</label><input id="shopName" placeholder="\u5982\uff1a\u7559\u58f0\u5149\u5f71\u660e\u4fe1\u7247"></div>';
  body+='<div class="form-group"><label>\u5151\u6362\u79ef\u5206</label><input id="shopPts" type="number" placeholder="\u5982 50"></div>';
  body+='<div class="form-group"><label>\u539f\u4ef7\uff08\u53ef\u9009\uff0c\u5212\u7ebf\u5c55\u793a\uff09</label><input id="shopPrice" type="number" placeholder="\u5982 29.9"></div>';
  body+='<div class="form-group"><label>\u7b80\u77ed\u63cf\u8ff0</label><input id="shopDesc" placeholder="\u4e00\u53e5\u8bdd\u63cf\u8ff0\u5546\u54c1"></div>';
  body+='<div class="form-group"><label>\u5b9d\u8d1d\u8be6\u60c5</label>';
  body+='<textarea id="shopDetail" rows="4" placeholder="\u8be6\u7ec6\u4ecb\u7ecd\u5546\u54c1\u7279\u70b9\u3001\u6750\u8d28\u3001\u5c3a\u5bf8\u7b49" style="width:100%;background:var(--dark3);border:1px solid var(--dark3);border-radius:8px;padding:10px;color:#fff;font-size:13px;resize:vertical"></textarea>';
  body+='</div>';
  body+='<div class="form-group"><label>\u5e93\u5b58\u6570\u91cf\uff08\u53ef\u9009\uff09</label><input id="shopStock" type="number" placeholder="\u4e0d\u586b\u8868\u793a\u4e0d\u9650"></div>';

    for(var i=0;i<PHOTOS.length;i++){

function selectShopImg(el,idx){
  var url=PHOTOS[idx].url;
  $('shopImg').value=url;
  previewShopImg(url);
  var s=el.parentNode.children;
  for(var i=0;i<s.length;i++){s[i].style.border='2px solid transparent';}
  el.style.border='2px solid var(--gold)';
}

function handleShopFile(input){
  var file=input.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showToast('\u56fe\u7247\u4e0d\u80fd\u8d85\u8fc75MB',true);return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var dataUrl=e.target.result;
    $('shopImg').value=dataUrl;
    previewShopImg(dataUrl);
  };
  reader.readAsDataURL(file);
}

function previewShopImg(url){
  var prev=$('shopImgPreview');
  if(!prev)return;
  if(url){
    prev.innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover">';
  }else{
    prev.innerHTML='<span style="color:var(--gray);font-size:13px">\u70b9\u51fb\u4e0b\u65b9\u9009\u62e9\u56fe\u7247\u6216\u7c98\u8d34URL</span>';
  }
}

function submitShopItem(){
  var name=$('shopName').value.trim();
  var pts=parseInt($('shopPts').value)||0;
  var price=$('shopPrice').value.trim();
  var desc=$('shopDesc').value.trim();
  var detail=$('shopDetail').value.trim();
  var img=$('shopImg').value.trim();
  var stockInput=$('shopStock').value.trim();
  var stock=stockInput?parseInt(stockInput):null;
  if(!name){showToast('\u8bf7\u8f93\u5165\u5546\u54c1\u540d\u79f0',true);return;}
  if(pts<=0){showToast('\u8bf7\u8f93\u5165\u6709\u6548\u79ef\u5206',true);return;}
  if(!API._data.shop)API._data.shop=[];
  var item={name:name,points:pts,desc:desc,detail:detail,img:img,redeemed:0};
  if(price)item.price=price;
  if(stock!==null)item.stock=stock;
  API._data.shop.push(item);
  API._saveLocal();API._writeRemote();
  closeModal();renderShop();
  showToast('\u5546\u54c1\u5df2\u53d1\u5e03');
}

function deleteShopItem(idx){
  var items=API._data.shop||[];if(!items[idx])return;
  if(!confirm('\u786e\u8ba4\u5220\u9664\u300c'+items[idx].name+'\u300d\uff1f'))return;
  items.splice(idx,1);
  API._saveLocal();API._writeRemote();
  renderShop();
  showToast('\u5546\u54c1\u5df2\u5220\u9664');
}

function renderSettings(){
  if(isAdmin()){
    $('setClubName').textContent=API._data.settings.club_name||'-';
  }
}

  $('modalContent').innerHTML=html;

function showUploadPoints(){
  openModal('<h3>\u4e0a\u4f20\u79ef\u5206\u660e\u7ec6 <span class="modal-close" onclick="closeModal()">&times;</span></h3>'+
    '<p style="font-size:13px;color:var(--gray);margin-bottom:12px">\u4e0a\u4f20Excel/CSV\u6587\u4ef6\uff0c\u683c\u5f0f\uff1a\u59d3\u540d\u3001\u79ef\u5206\u3001\u539f\u56e0\u3001\u65e5\u671f</p>'+
    '<div class="upload-area" onclick="document.getElementById(\'pointsFile\').click()">'+
    '\u70b9\u51fb\u9009\u62e9\u6587\u4ef6'+
    '<input id="pointsFile" type="file" accept=".csv,.xlsx,.xls" onchange="parsePointsFile(this)">'+
    '</div>'+
    '<div id="pointsPreview" style="margin-top:12px"></div>'+
    '<button class="btn btn-gold" style="width:100%;margin-top:12px;display:none" id="confirmPointsBtn" onclick="confirmUploadPoints()">\u786e\u8ba4\u5bfc\u5165</button>');
}

function parsePointsFile(input){
  var file=input.files[0];
  if(!file)return;
  // For CSV files, use FileReader
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    var records=[];
    // Skip header if first line contains text like "name" or chinese
    var startIdx=0;
    if(lines[0]&&/name|\u59d3\u540d/i.test(lines[0]))startIdx=1;
    for(var i=startIdx;i<lines.length;i++){
      var parts=lines[i].split(',').map(function(s){return s.trim();});
      if(parts.length>=2&&parts[0]){
        records.push({name:parts[0],points:parseInt(parts[1])||0,reason:parts[2]||'',date:parts[3]||new Date().toISOString().slice(0,10)});
      }
    }
    if(!records.length){showToast('\u672a\u89e3\u6790\u51fa\u6709\u6548\u6570\u636e',true);return;}
    window._pendingPoints=records;
    var html='<table class="points-table"><tr><th>\u59d3\u540d</th><th>\u79ef\u5206</th><th>\u539f\u56e0</th><th>\u65e5\u671f</th></tr>';
    records.forEach(function(r){html+='<tr><td>'+esc(r.name)+'</td><td>'+r.points+'</td><td>'+esc(r.reason)+'</td><td>'+r.date+'</td></tr>';});
    html+='</table><p style="font-size:12px;color:var(--gray);margin-top:8px">\u5171 '+records.length+' \u6761\u8bb0\u5f55</p>';
    $('pointsPreview').innerHTML=html;
    $('confirmPointsBtn').style.display='block';
  };
  reader.readAsText(file,'UTF-8');
}

function confirmUploadPoints(){
  if(!window._pendingPoints||!window._pendingPoints.length)return;
  API.addPointsBatch(window._pendingPoints);
  window._pendingPoints=null;
  closeModal();
  renderPoints();
  showToast('\u79ef\u5206\u5df2\u5bfc\u5165');
}
