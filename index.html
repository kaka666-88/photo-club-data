<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留声光影 - 摄影社团管理系统</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0a0a0b;
  --bg-secondary: #141416;
  --bg-tertiary: #1c1c1f;
  --bg-card: #1e1e22;
  --bg-hover: #26262b;
  --border: #2a2a30;
  --text-primary: #e8e8e8;
  --text-secondary: #9a9aa0;
  --text-muted: #5c5c62;
  --accent: #c8a44e;
  --accent-hover: #d8b45e;
  --accent-dim: rgba(200,164,78,0.12);
  --green: #5cb85c;
  --red: #d4574e;
  --blue: #4a90d9;
  --purple: #9b6dff;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
button { font-family: var(--font); cursor: pointer; border: none; border-radius: var(--radius-sm); }
input, textarea, select {
  font-family: var(--font);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
  font-size: 13px;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }

/* ===== Login Screen ===== */
#loginScreen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: var(--bg-primary);
  background-image: radial-gradient(circle at 30% 20%, rgba(200,164,78,0.06) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(74,144,217,0.04) 0%, transparent 50%);
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 380px;
  max-width: 90vw;
  box-shadow: var(--shadow);
  text-align: center;
}
.login-card .logo {
  width: 64px;
  height: 64px;
  margin: 0 auto 16px;
  background: var(--accent);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #1a1a1a;
}
.login-card h1 { font-size: 20px; margin-bottom: 4px; }
.login-card .subtitle { color: var(--text-secondary); font-size: 12px; margin-bottom: 28px; }
.login-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.login-tabs button {
  flex: 1;
  background: transparent;
  color: var(--text-secondary);
  padding: 8px;
  font-size: 13px;
  transition: all 0.2s;
}
.login-tabs button.active {
  background: var(--accent);
  color: #1a1a1a;
  font-weight: 600;
}
.login-card input { margin-bottom: 12px; }
.login-card .btn-login {
  width: 100%;
  background: var(--accent);
  color: #1a1a1a;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 4px;
  transition: background 0.2s;
}
.login-card .btn-login:hover { background: var(--accent-hover); }
.login-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 8px;
  min-height: 18px;
}
.login-hint {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 20px;
  line-height: 1.5;
}

/* ===== Main App Layout ===== */
#app { display: none; }
#app.active { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  overflow-y: auto;
}
.sidebar-header {
  padding: 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header .logo {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #1a1a1a;
  flex-shrink: 0;
}
.sidebar-header .title { font-size: 15px; font-weight: 600; }
.sidebar-header .subtitle { font-size: 10px; color: var(--text-muted); }
.nav-list { flex: 1; padding: 12px 8px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
.nav-item .icon { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent);
  color: #1a1a1a;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.sidebar-footer .role-tag {
  display: inline-block;
  background: var(--bg-tertiary);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  margin-bottom: 6px;
}
.sidebar-footer .logout-btn {
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  background: none;
  padding: 0;
}
.sidebar-footer .logout-btn:hover { color: var(--red); }

/* Main Content */
.main {
  flex: 1;
  margin-left: 220px;
  padding: 24px 32px;
  max-width: calc(100vw - 220px);
}
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.page-header h2 { font-size: 22px; font-weight: 600; }
.page-header .actions { display: flex; gap: 8px; }

/* Buttons */
.btn {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  border: 1px solid var(--border);
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }
.btn-primary {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 500;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: rgba(212,87,78,0.1); border-color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.stat-card .stat-icon { font-size: 22px; margin-bottom: 8px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Table */
.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg-secondary); }
th {
  text-align: left;
  padding: 10px 14px;
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
tbody tr:hover { background: var(--bg-hover); }
tbody tr:last-child td { border-bottom: none; }

/* Badges & Tags */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.tag-green { background: rgba(92,184,92,0.15); color: var(--green); }
.tag-blue { background: rgba(74,144,217,0.15); color: var(--blue); }
.tag-amber { background: var(--accent-dim); color: var(--accent); }
.tag-red { background: rgba(212,87,78,0.15); color: var(--red); }
.tag-gray { background: var(--bg-tertiary); color: var(--text-muted); }

/* Status dots */
.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}
.status-dot.active { background: var(--green); }
.status-dot.pending { background: var(--accent); }
.status-dot.done { background: var(--blue); }
.status-dot.cancelled { background: var(--text-muted); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 520px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.modal h3 { font-size: 18px; margin-bottom: 20px; }
.modal .form-group { margin-bottom: 16px; }
.modal .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.modal .form-row { display: flex; gap: 12px; }
.modal .form-row .form-group { flex: 1; }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; }

/* Search Bar */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.search-bar input { max-width: 320px; }
.search-bar select { max-width: 160px; }

/* Content List */
.content-list { display: flex; flex-direction: column; gap: 12px; }
.content-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: border-color 0.15s;
}
.content-item:hover { border-color: var(--text-muted); }
.content-item .item-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.content-item .item-title { font-size: 15px; font-weight: 600; }
.content-item .item-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
.content-item .item-body { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-top: 6px; }
.content-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* Leaderboard */
.leaderboard-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.leaderboard-row:last-child { border-bottom: none; }
.rank {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a1a; }
.rank-2 { background: linear-gradient(135deg, #c0c0c0, #999); color: #1a1a1a; }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
.rank-other { background: var(--bg-tertiary); color: var(--text-muted); }
.lb-name { flex: 1; font-weight: 500; }
.lb-points { font-size: 16px; font-weight: 700; color: var(--accent); }

/* Filter Tabs */
.filter-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-tab {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.filter-tab:hover { color: var(--text-primary); }
.filter-tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 13px;
  z-index: 2000;
  box-shadow: var(--shadow);
  transform: translateX(400px);
  transition: transform 0.3s;
}
.toast.show { transform: translateX(0); }
.toast.error { border-left-color: var(--red); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    width: 60px;
    overflow: hidden;
  }
  .sidebar-header .title, .sidebar-header .subtitle,
  .nav-item span:not(.icon), .nav-item .badge,
  .sidebar-footer { display: none; }
  .sidebar-header { justify-content: center; }
  .nav-item { justify-content: center; }
  .main { margin-left: 60px; max-width: calc(100vw - 60px); padding: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .modal { width: 95vw; }
  .modal .form-row { flex-direction: column; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .search-bar { flex-direction: column; }
  .search-bar input, .search-bar select { max-width: 100%; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Detail View */
.detail-view {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.detail-view h3 { font-size: 18px; margin-bottom: 8px; }
.detail-view .detail-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; display: flex; gap: 16px; flex-wrap: wrap; }
.detail-view .detail-body { font-size: 14px; line-height: 1.8; color: var(--text-secondary); white-space: pre-wrap; }

/* Points History */
.points-history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.points-history-item:last-child { border-bottom: none; }
.points-delta { font-weight: 700; }
.points-delta.positive { color: var(--green); }
.points-delta.negative { color: var(--red); }

/* Mobile menu toggle */
.menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 18px;
}
@media (max-width: 768px) {
  .menu-toggle { display: block; }
  .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
  .sidebar.open { transform: translateX(0); width: 200px; }
  .sidebar.open .title, .sidebar.open .subtitle,
  .sidebar.open .nav-item span:not(.icon), .sidebar.open .nav-item .badge,
  .sidebar.open .sidebar-footer { display: block; }
  .sidebar.open .nav-item { justify-content: flex-start; }
  .sidebar.open .sidebar-header { justify-content: flex-start; }
  .main { margin-left: 0; max-width: 100vw; padding-top: 50px; }
}

/* ===== Shop Grid ===== */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.shop-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.15s, transform 0.15s;
  display: flex;
  flex-direction: column;
}
.shop-card:hover { border-color: var(--text-muted); transform: translateY(-2px); }
.shop-card .shop-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: var(--bg-secondary);
}
.shop-card .shop-img-placeholder {
  width: 100%;
  aspect-ratio: 1;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  color: var(--text-muted);
}
.shop-card .shop-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; }
.shop-card .shop-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.shop-card .shop-desc { font-size: 12px; color: var(--text-muted); flex: 1; margin-bottom: 8px; line-height: 1.5; }
.shop-card .shop-footer { display: flex; align-items: center; justify-content: space-between; }
.shop-card .shop-price { font-size: 16px; font-weight: 700; color: var(--accent); }
.shop-card .shop-price small { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.shop-card .shop-stock { font-size: 11px; color: var(--text-muted); }
.shop-card .shop-actions { display: flex; gap: 6px; padding: 0 14px 12px; }

/* ===== Registration Form on Login ===== */
.login-card .reg-hint { font-size: 11px; color: var(--text-muted); margin-top: 12px; }

/* ===== Registration List ===== */
.reg-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.reg-item .reg-info { flex: 1; }
.reg-item .reg-name { font-size: 14px; font-weight: 600; }
.reg-item .reg-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ===== Dashboard Welcome ===== */
.welcome-banner {
  background: linear-gradient(135deg, var(--bg-card), var(--bg-tertiary));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.welcome-banner .wb-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  flex-shrink: 0;
}
.welcome-banner .wb-text h3 { font-size: 18px; font-weight: 600; }
.welcome-banner .wb-text p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ===== Login logo image ===== */
.login-card .logo-img {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;
  border-radius: 16px;
  display: block;
  object-fit: cover;
}
.sidebar-header .logo-img {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  flex-shrink: 0;
  object-fit: cover;
}

/* ===== Badge count on nav ===== */
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
  min-width: 18px;
  text-align: center;
}

/* ===== Shop modal image preview ===== */
.img-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  margin-top: 8px;
  border: 1px solid var(--border);
}

</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div id="loginScreen">
  <div class="login-card">
    <img class="logo-img" src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png" alt="logo" onerror="this.style.display='none';document.getElementById('loginLogoFallback').style.display='flex'">
    <div class="logo" id="loginLogoFallback" style="display:none">&#128247;</div>
    <h1>留声光影</h1>
    <p class="subtitle">用镜头记录世界，用光影讲述故事</p>
    <div class="login-tabs">
      <button id="tabAdmin" class="active" onclick="switchLoginTab('admin')">管理员登录</button>
      <button id="tabGuest" onclick="switchLoginTab('guest')">访客进入</button>

      "content": "曝光是摄影的核心技术基础，由光圈、快门、ISO三个要素共同决定。\n\n一、光圈（Aperture）\n光圈控制镜头进光孔的大小，用f值表示（f/1.4、f/2.8、f/8等）。\n- f值越小=光圈越大=进光越多=景深越浅（背景虚化更强）\n- f值越大=光圈越小=进光越少=景深越大（前后都清晰）\n- 人像常用 f/1.8-f/2.8 虚化背景；风光常用 f/8-f/11 保证全景清晰\n- 避坑：光圈太大（如f/1.2）可能导致对焦不准，新手建议用f/2.8\n\n二、快门速度（Shutter Speed）\n快门控制传感器曝光时间，用秒或分之一秒表示。\n- 快速快门（1/500s以上）：凝固运动瞬间，适合体育、鸟类\n- 中速快门（1/60s-1/250s）：日常拍摄，手持最低1/60秒防抖\n- 慢速快门（1秒以上）：记录运动轨迹，如车流光轨、丝滑水流\n- 避坑：手持拍摄快门不低于1/60秒（广角可放宽至1/30秒），更慢需三脚架\n\n三、感光度（ISO）\nISO控制传感器对光的敏感度。\n- ISO 100-200：画质最干净，适合白天、光线充足场景\n- ISO 400-800：弱光环境，画质仍可接受\n- ISO 1600以上：暗光应急，噪点明显增加\n- 原则：优先用低ISO，通过光圈和快门调整曝光，ISO作为最后手段提升\n\n四、曝光三要素的互易关系\n三者可以互相补偿：缩小一档光圈（进光减半），可以放慢一档快门或提高一档ISO来补偿。理解这个互易律，就能在任何光线条件下灵活组合参数。\n\n五、白加黑减原则\n拍摄浅色主体时需增加曝光补偿（+0.3到+1EV），深色主体时减少补偿。因为相机测光系统以18%灰为基准，会自动把白色拍灰、黑色也拍灰。",

      "content": "构图是摄影的骨架，决定照片的视觉结构和叙事效果。\n\n一、三分法（九宫格构图）\n最经典、最稳妥的构图法。打开手机网格线，画面分成九宫格，将重要元素放在交叉点或线条上。\n- 人像：眼睛放在上1/3交叉点，视线方向留出空间\n- 风景：地平线放在上1/3（突出地面）或下1/3（突出天空），避免放正中间\n- 建筑：主体沿左1/3或右1/3竖线排列\n\n二、引导线构图\n利用道路、河流、走廊、栏杆等有方向性的线条引导观众视线。\n- 低角度拍道路，近大远小的透视感最强\n- S型曲线（河流、山路）柔美自然\n- 多条线汇聚的消失点最有冲击力\n\n三、框架构图\n用门窗、拱廊、树枝作为前景框架，主体被框在中间，增加层次感和代入感。旅行拍摄中透过门框或窗户拍远处建筑或人物，比直接拍有趣十倍。\n\n四、对角线构图\n将主体沿对角线排列，制造动感和张力。适合拍跑步、行走、延伸的道路。倾斜幅度5-15度最容易出效果。\n\n五、极简构图（留白艺术）\n找到干净的墙、天空或水面，只放一个主体。背景越干净，主体越突出。拍美食、人像、小物件都好用，高级感很强。\n\n六、对称构图\n利用水面倒影、建筑对称结构，营造庄重、平衡的视觉效果。\n\n七、三角形构图\n三个视觉重心构成三角形，稳定中有变化，适合群像和静物。\n\n八、构图减法三原则\n1. 裁剪减法：通过取景裁掉杂乱元素\n2. 景深减法：用大光圈虚化干扰背景\n3. 阻挡减法：用前景遮挡不想要的部分\n画面元素严格控制在三种以内，杜绝电线杆、垃圾桶等杂物入镜。",

      "content": "人像摄影的核心是突出人物、表达情绪、避免僵硬。\n\n一、人像景别选择\n- 远景（全身+环境）：交待环境故事，适合旅拍\n- 全景（全身）：展示服装和姿态\n- 中景（膝盖以上）：日常交流距离，自然亲切\n- 近景（胸部以上）：突出面部表情\n- 特写（面部/局部）：强调眼神、嘴唇、手部细节\n新手建议从中景和近景开始练习，最容易出效果。\n\n二、人像构图要点\n- 眼睛放在上1/3交叉点\n- 视线方向留白占画面2/3\n- 横构图展示环境，竖构图突出人物\n- 避免裁切到关节（脖子、腰、膝盖），从关节中间裁切\n- 人物占比不超过1/4时，利用留白营造氛围\n\n三、人像用光\n- 顺光：色彩鲜艳、皮肤干净，但缺乏立体感\n- 侧光（45度）：立体感最强，五官轮廓深邃，最推荐\n- 逆光：发丝发光、氛围感强，需对脸部点测光+增加0.7-1EV曝光补偿\n- 顶光（正午）：面部阴影重，尽量避开\n- 阴天：天然柔光箱，皮肤细腻，不挑角度，拍人像的好天气\n\n四、摆姿引导\n- 侧身30度+下巴微收：显瘦显高\n- 回眸抓拍：自然有动感\n- 走路抓拍：手臂自然摆动，大光圈虚化背景\n- 借道具互动：帽子、咖啡杯、围巾，避免手无处安放\n- 原地转圈：穿裙装时小幅度旋转，连拍锁定最佳帧\n- 摄影师需提前沟通节奏：准备-开始-停\n\n五、常见避坑\n- 脸色暗沉：携带小型反光板或手机手电筒补光\n- 正午光斑：找树荫下拍摄，避免脸上出现难看光斑\n- 僵硬站姿：让模特走动、转身、低头看景，抓拍自然瞬间",

      "content": "风光摄影拼的是前期策划、光线判断和器材运用的综合能力。\n\n一、黄金时刻与蓝调时刻\n- 黄金时刻：日出后1小时、日落前1小时，光线柔和温暖，阴影修长，是风光摄影的魔法时间\n- 蓝调时刻：日落后天黑前约10-15分钟，天空呈深邃蓝色，城市灯光刚亮，拍城市夜景干净通透\n- 如果只有一次拍摄机会，选黄金时刻\n\n二、山景拍摄\n- 夶大前景增加深度：用广角镜头贴近前景岩石或花草\n- 表现山峰层次与细节：用长焦压缩透视，突出山脊连绵的韵律美\n- 人物与山景呼应：加入人物作为比例参照\n- 利用倒影丰富画面内容：山前有湖泊时使用\n- 日照金山：日出日落时山尖被金色阳光照亮，需提前踩点等待\n\n三、水景拍摄\n- 慢门水流效果：快门1-5秒拍出丝绸质感，需三脚架+ND滤镜\n- 波光粼粼水面：快门1/250s以上凝固光斑\n- 水面倒影：无风时拍摄最清晰，对称构图\n- 水景线条之美：利用河流S型曲线引导视线\n\n四、林木拍摄\n- 寻找延伸线条增强空间感\n- 重复性构图表现韵律之美\n- 林间光影之美：清晨雾气中光线穿透树冠的丁达尔效应\n- 疏可走马、密不透风：利用疏密对比\n\n五、冰雪拍摄\n- 中长调雪景更动人：适当增加曝光补偿+0.3-1EV（白加黑减）\n- 搭配深色景物增加对比\n- 低照度光线强化雪地表面质感\n- 冷暖搭配：蓝色阴影与金色暖光的对比\n\n六、云雾拍摄\n- 拍云海需高海拔+湿度+无风\n- 黄金时刻和蓝调时刻拍云海最佳\n- 用慢门表现云海流动感",

      "content": "测光决定了相机如何计算曝光值，选对测光模式是准确曝光的关键。\n\n一、评价测光（多重测光/矩阵测光）\n- 原理：将画面分成多个区域，综合计算平均亮度\n- 适用：大光比不大的场景、风光、日常记录、抓拍\n- 特点：最安全的模式，大多数场景不会严重失误\n\n二、点测光\n- 原理：仅测量画面中心约2-8%极小区域的亮度\n- 适用：逆光人像、舞台摄影、高反差场景\n- 特点：精准控制主体曝光，但需对准正确位置\n- 技巧：逆光人像时对准面部点测光，增加+0.7-1EV曝光补偿\n\n三、中央重点平均测光\n- 原理：以画面中央约60-75%区域为主，兼顾边缘\n- 适用：主体在画面中央的场景、肖像、纪念照\n- 特点：兼顾主体与环境的平衡\n\n四、局部测光\n- 原理：测量画面中央约8-12%的区域\n- 适用：主体比点测光区域大但比评价测光集中的场景\n\n五、曝光补偿的使用\n- 白加黑减原则：拍白色主体增加补偿，黑色主体减少补偿\n- 逆光人像：+0.7到+2EV，宁可高光轻微溢出也要保证面部细节\n- 雪景：+0.3到+1EV，避免雪拍成灰色\n- 深色背景前的人物：-0.3到-0.7EV，压暗背景突出人物\n\n六、直方图判断曝光\n- 波形靠左=欠曝（暗部死黑无细节）\n- 波形靠右=过曝（高光溢出无细节）\n- 理想状态：波形集中在中间偏右，不贴左右墙壁\n- 主体亮度应集中在中灰至高光区",

      "content": "景深是指照片中清晰成像的范围，控制景深是摄影最重要的技能之一。\n\n一、影响景深的三个因素\n1. 光圈大小\n   - 光圈越大（f值越小），景深越浅，背景虚化更强\n   - 光圈越小（f值越大），景深越大，前后都清晰\n   - 这是控制景深最直接的方法\n\n2. 焦距长短\n   - 焦距越长（如200mm），景深越浅，虚化更强\n   - 焦距越短（如24mm），景深越大，更多清晰\n   - 长焦镜头即使光圈不大也能获得明显虚化\n\n3. 拍摄距离\n   - 相机离主体越近，景深越浅\n   - 相机离主体越远，景深越大\n   - 微距摄影因为极近距离，景深极浅\n\n二、实现最大虚化的四步法\n1. 开大光圈（f/1.8-f/2.8）\n2. 使用长焦镜头（85mm以上人像最佳）\n3. 靠近主体拍摄\n4. 让主体远离背景（背景越远虚化越明显）\n\n三、实现最大清晰范围（风光摄影）\n1. 缩小光圈（f/8-f/11，避免f/16以上衍射影响画质）\n2. 使用广角镜头（16-35mm）\n3. 对焦在画面下1/3处（超焦距原理）\n4. 使用三脚架保证低速快门稳定\n\n四、超焦距技术\n对焦在超焦距点上，从该距离的一半到无穷远都清晰。适用于街拍、纪实、风光。\n\n五、手机虚化技巧\n- 使用人像模式（双摄虚化或算法虚化）\n- 靠近主体+远离背景\n- 使用长焦端（2x/3x变焦）\n- 丝袜罩镜头可制造梦幻光斑效果",

      "category": "曝光控制",
      "tags": "白平衡,色温,色彩,情绪",
      "content": "白平衡（White Balance）决定照片的整体色调，既影响色彩准确性，也影响画面情绪。\n\n一、什么是白平衡\n白平衡的作用是让白色在不同光源下都呈现为白色，从而保证其他颜色准确还原。核心参数是色温（Kelvin，K）。\n\n二、色温与画面效果\n- 低色温（2700K-3200K）：偏黄/暖色调，温馨、怀旧、烛光感\n- 中色温（5000K-5500K）：标准日光，色彩自然还原\n- 高色温（6500K以上）：偏蓝/冷色调，清冷、科技感、忧郁感\n\n三、不同场景的白平衡设置\n- 城市冷调夜景：3200K-3800K，画面清冷干净高级感足\n- 暖调夜景/街边氛围：4500K-5000K，色调温柔柔和\n- 不确定时锁定4000K：万金油数值，不偏色不突兀\n- 人像肤色保证：4500K-5500K，肤色自然\n\n四、创意白平衡运用\n- 日落暖调：故意设高色温（6000K+），强化金色氛围\n- 阴天清冷：故意设低色温（3000K），强化忧郁感\n- 蓝调时刻夜景：设低色温（2500-3200K），强化蓝色天空\n\n五、白平衡偏移\n除了色温，还可以在绿-洋红轴上偏移：\n- 偏绿：增加清新感、自然感\n- 偏洋红：增加浪漫感、粉嫩感\n- 人像常用微偏洋红+暖色温，肤色更通透\n\n六、后期色彩调整思路\n- 日系清新风：提亮暗部、降低对比度、色温微偏冷、红色饱和度-15、绿色转青绿\n- 电影复古风：压暗高光、色温大幅偏暖、加暗角、色调分离高光加橙阴影加青\n- 关键原则：肤色保护优先，人脸发灰需单独提亮橙色明度",

    {
      "id": 8,
      "title": "后期处理标准流程：从RAW到成片",
      "category": "后期修图",
      "tags": "RAW,Lightroom,Photoshop,修图流程,调色",
      "content": "后期是影像的第二次生命，建立标准化的修图流程能大幅提升效率和质量。\n\n一、RAW格式的优势\n- 记录传感器原始数据，保留约12-14档动态范围\n- 后期可无损调整曝光、白平衡、色彩\n- 比JPEG多2-3档的曝光找回空间\n- 缺点：文件大、需转换后输出\n\n二、标准后期流程（Lightroom/ACR）\n\n第一步：基础校正\n1. 镜头校正：开启配置文件校正，去除暗角和畸变\n2. 裁剪二次构图：修正地平线水平、调整构图比例\n3. 透视校正：建筑摄影修正梯形畸变\n\n第二步：全局调色\n1. 白平衡：调整色温和色调，确定整体色调方向\n2. 曝光：整体亮度调整（通常微增+0.3）\n3. 高光：压低-20至-40，保留天空和灯光细节\n4. 阴影：提亮+20至+40，还原暗部细节\n5. 白色色阶：微调最亮区域\n6. 黑色色阶：微提+10，让死黑变深灰\n7. 对比度：根据风格调整（日系-10以下，电影感+15）\n\n第三步：色彩精调（HSL面板）\n1. 红色：饱和度-15、明度+10（保护肤色）\n2. 橙色：明度+15（提亮面部）\n3. 绿色：色相+10转青绿（日系风）\n4. 蓝色：饱和度+10（强化天空）\n5. 黄色：饱和度-10（削弱杂色）\n\n第四步：局部调整\n1. 径向滤镜：提亮主体周围\n2. 渐变滤镜：压暗天空、提亮地面\n3. 调整画笔：局部提亮眼神光、压暗杂物\n4. 蒙版保护面部：避免随背景一同调色\n\n第五步：风格化\n1. 色调分离：高光加橙（色相35）、阴影加青（色相200）\n2. 颗粒：添加5-15模拟胶片质感\n3. 暗角：-15聚焦中心\n4. 清晰度/纹理：适度增加+10至+20增强细节\n\n三、手机端修图公式\n遵循提暗不提亮原则：\n1. 小幅增加整体曝光\n2. 大幅拉高阴影找回暗部\n3. 降低高光防止过曝\n4. 黑色色阶右移，死黑变深灰\n5. 增加清晰度与去雾对抗发灰\n6. S型曲线重建对比度\n\n四、避坑指南\n- 慎用美颜：关闭自动磨皮，手动调整避免失真\n- 统一滤镜：同组照片用同系列滤镜，保持风格一致\n- 肤色优先：任何调色都要先保护肤色自然",

      "content": "本指南由Marcus Chen撰写，为2026年零基础学习者设计了一套完整的30天入门路线图，覆盖技术基础、构图美学、器材选择和后期处理。\n\n核心三支柱：\n1. 曝光三角：快门速度、光圈、ISO三者协同控制每张照片的亮度和质感\n2. 构图法则：三分法等构图规则让画面瞬间更有吸引力\n3. 每日拍摄：用任何相机（包括手机）每天拍摄，30天积累技能比任何课程都有效\n\n一、什么是摄影\n- 摄影是使用相机、镜头和传感器（或胶片）捕捉光线创造图像的艺术与技术\n- 现代智能手机能拍出15年前需要5000美元设备才能获得的图像\n- 技术门槛已大幅降低，难点在于学会'观看'\n- 布列松名言：'你的前10000张照片是最差的'——刻意练习的量比器材和天赋更重要\n\n二、曝光三角详解\n- 快门速度：控制光线照射传感器的时间长短，影响画面动静效果\n- 光圈：控制镜头进光孔大小，影响景深（背景虚化程度）\n- ISO：控制传感器对光的敏感度，影响画质噪点\n- 三者互相补偿：缩小一档光圈可放慢一档快门或提高一档ISO来补偿\n\n三、构图基础\n- 三分法：将画面分成九宫格，主体放在交叉点或线条上\n- 引导线：利用道路、河流等线条引导观众视线\n- 框架构图：用门窗、树枝等前景元素框住主体\n- 对称构图：利用倒影或建筑结构营造平衡感\n- 极简构图：干净背景+单一主体，少即是多\n\n四、器材选择\n- DSLR vs 无反 vs 智能手机：各有所长，手机是合法的入门工具\n- 第一台相机选择原则：预算内买最好的传感器和镜头，而非追求品牌\n- 镜头比机身更重要：投资好镜头的回报率高于升级机身\n\n五、30天入门路线图\n- 第1-10天：掌握曝光三角，每天用M档拍摄50张\n- 第11-20天：练习构图法则，每天强制使用一种构图法\n- 第21-30天：主题创作，选择人像/风光/街拍等题材深度练习\n\n六、10个快速提升技能的练习\n1. 用M档拍100张同一场景，体会参数变化\n2. 只用50mm定焦镜头拍一周\n3. 每天拍一张三分法构图照片\n4. 拍一组逆光人像练习曝光补偿\n5. 用手机拍一组极简构图\n6. 拍一组引导线构图\n7. 练习追随拍摄拍运动物体\n8. 拍一组黑白照片练习影调\n9. 后期修图练习：Lightroom基础调整\n10. 模仿一位大师作品并分析差异\n\n七、后期处理基础\n- RAW格式的优势与处理流程\n- Lightroom基础：曝光、高光、阴影、白平衡调整\n- 免费替代工具推荐\n\n八、持续进步的方法\n- 研究其他摄影师作品，训练'摄影眼'\n- 加入摄影社区获取反馈\n- 建立个人作品集记录成长",

      "content": "手机摄影因焦段固定（通常等效24-28mm广角），构图反而更需要讲究。掌握以下五种构图法，照片立刻提升一个档次。\n\n1. 三分法：最稳妥也最出效果\n打开手机网格线，画面分成九宫格。拍人像眼睛放在上1/3交叉点，拍风景地平线放在上1/3或下1/3。永远不要把地平线放在正中间。\n\n2. 引导线：让画面有方向感\n利用道路、河流、走廊、栏杆引导视线。低角度拍道路透视感最强，S型曲线柔美自然，多条线汇聚的消失点最有冲击力。\n\n3. 框架构图：增加层次感\n用门窗、拱廊、树枝作为前景框架，主体被框在中间。旅行拍摄中透过门框或窗户拍远处建筑或人物，比直接拍有趣十倍。\n\n4. 对角线构图：制造动感\n将主体沿对角线排列，倾斜幅度5-15度最容易出效果。适合拍跑步、行走、延伸的道路。\n\n5. 极简构图：少即是多\n找到一面干净的墙、一片天空、一汪水面，只放一个主体。背景越干净，主体越突出。拍美食、人像、小物件都好用，高级感很强。\n\n每日练习：拍摄20张照片，强制使用三种构图法，删除杂乱废片，培养一眼定构图能力。",

      "title": "夜景拍摄完全指南：参数设置与实操技巧",
      "category": "曝光控制",
      "content": "夜景是摄影的难点也是出大片的机会，关键在于稳定、测光和参数控制。\n\n一、最佳拍摄时段\n黄金时刻（日落后15-25分钟的蓝调时刻）是夜景拍摄最佳窗口。此时天空呈深邃蓝色，与地面暖黄灯光形成冷暖对比，画面既有氛围又不失细节。避开纯黑无光区域，主动寻找车灯、橱窗、霓虹作为前景光源。\n\n二、相机参数设置\n- ISO：固定在100-200，城市灯光场景优先用100，超过800噪点肉眼可见\n- 快门速度：日常夜景1/10秒至2秒；车流拉丝2-5秒；星空15-30秒\n- 光圈：f/8保证全景清晰，大光圈f/1.8适合突出主体虚化背景\n- 必须使用三脚架，配合遥控快门或10秒倒计时避免震动\n\n三、手机夜景技巧\n- 安卓旗舰超级夜景模式：AI驱动多帧合成，保持手机静止3-5秒\n- 专业模式：ISO 100-400，快门1/2秒，白平衡锁定4000K\n- 利用高光抑制功能压制路灯过曝\n- 长按屏幕锁定对焦与曝光，避免画面忽明忽暗\n\n四、测光与曝光补偿\n- 相机切换至点测光，对准主体最亮区域\n- 逆光人像需增加+1至+2档曝光补偿\n- 直方图判断：波形远离左侧死黑墙\n- 白加黑减在逆光中需反向应用——宁可高光轻微溢出\n\n五、长曝光与光绘\n- 车流光轨：快门1-5秒，光圈f/8，ISO 100\n- 云彩流动：10秒以上\n- 星轨：15-30秒，B门模式适用于30秒以上\n- 光绘：人在空中画图案，需暗环境+长曝光+手电筒\n\n六、后期修图公式\n提暗不提亮：先小幅增加曝光，再大幅拉高阴影，同步降低高光，黑色色阶右移让死黑变深灰，最后增加清晰度对抗发灰。",

      "title": "夜景人像封神指南：参数+补光+创意玩法",
      "category": "人像摄影",
      "content": "夜景人像是摄影界的翻车重灾区——不是人脸黑成剪影，就是背景糊成一片。掌握以下技巧，手机和相机都能拍出氛围感大片。\n\n一、相机参数黄金组合\n- 光圈：f/1.8-2.8，大光圈增加进光量+虚化背景。新手建议f/2.8避免对焦不准\n- 快门：1/60秒以上（手持防抖底线），动态抓拍需1/200秒以上\n- ISO：控制在800以内，优先用三脚架+慢快门降低ISO\n- 对焦点：精准对准人物面部\n\n二、手机参数设置\n- 专业模式：光圈f/1.8，快门1/50秒，ISO 400\n- 对焦人脸后下拉小太阳降低背景过曝\n- 普通模式：开启夜景人像功能，点击对焦人脸后长按锁定曝光\n\n三、补光技巧（低成本解决脸黑）\n专业补光：LED棒灯（可调色温2500K-6500K），反光板（银色面补光强，金色面增加暖调）\n日常替代：手机闪光灯+蒙白纸柔化，便利店白色塑料袋套灯上做柔光罩，利用路灯/橱窗光（侧光位置最佳）\n\n补光位置对比：\n- 侧光（45度）：面部立体感强，适合轮廓深邃的五官\n- 逆光补光（灯在后方+反光板正面）：发丝发光效果，背景不过曝\n- 顶光：慎用！容易在眼窝、下巴形成恐怖阴影\n\n四、创意玩法\n1. 车流光轨背景：模特静止，快门2-4秒，LED灯短暂照亮模特1秒\n2. 霓虹灯街拍：靠近霓虹招牌，后期黑金滤镜+提升蓝红色饱和\n3. 雨夜情绪片：透明雨伞+湿发+积水反光，快门1/100秒抓拍雨滴\n\n五、避坑指南\n- 直闪导致鬼脸：闪光灯角度向上45度，或用柔光罩\n- 阴阳脸：让模特左前方补光\n- 发丝不亮：让模特微微抬头，路灯自然打亮发丝\n- 后期：VSCO滤镜A8+颗粒感15%，局部提亮眼神光",

      "title": "黄金时刻与蓝调时刻：一天中最佳拍摄时段",
      "category": "风光摄影",
      "content": "光线是摄影的灵魂，选对时段比选对器材重要一百倍。一天中有两个魔法时段和两个特殊时段值得掌握。\n\n一、黄金时刻（Golden Hour）\n- 时间：日出后1小时、日落前1小时\n- 光线特点：色温约3000-5000K，光线柔和温暖，阴影修长，角度低斜\n- 适合：人像（温柔暖光打亮皮肤）、风光（金色大地）、建筑（侧面立体感）\n- 如果只有一次拍摄机会，选这个时段\n\n二、蓝调时刻（Blue Hour）\n- 时间：日落后天黑前约10-25分钟（傍晚），天亮前约10-25分钟（清晨）\n- 光线特点：天空呈深邃蓝色，城市灯光刚亮，冷暖对比强烈\n- 适合：城市夜景（干净通透，比全黑后拍好看得多）、建筑剪影、蓝调人像\n- 技巧：提前踩点，蓝调时刻持续时间短，需快速拍摄\n\n三、正午硬光（避开或利用）\n- 光线特点：太阳直射，阴影短而硬，对比强烈\n- 不适合：人像（面部阴影重、显老）、风光（缺少层次）\n- 适合：建筑几何感、强烈对比的街拍、黑白摄影\n- 避坑：找树荫下拍摄人像，利用树叶遮挡直射光\n\n四、阴天柔光（被低估的好天气）\n- 光线特点：云层充当天然柔光箱，光线均匀无硬阴影\n- 适合：人像（皮肤细腻、不挑角度）、花卉微距、瀑布溪流\n- 优势：不需要担心光位和阴影方向，全场景通用\n\n五、实用时间表\n- 5:00-6:00 蓝调时刻（清晨）\n- 6:00-7:00 黄金时刻（日出）\n- 9:00-16:00 普通日光（避开正午或找阴影）\n- 16:00-18:00 黄金时刻（日落前）\n- 18:00-18:25 蓝调时刻（傍晚）\n- 18:25以后 城市夜景\n\n建议使用APP（如PhotoPills、The Photographers Ephemeris）精确查询当地每日黄金时刻和蓝调时刻时间。",

      "category": "后期修图",
      "content": "不需要下载修图软件，手机自带编辑功能完全够用。掌握以下三步法，照片质感立刻提升。\n\n第一步：基础调整\n1. 裁剪二次构图：修正地平线水平，调整构图比例\n2. 轻微提升亮度：+5到+10，不要过亮\n3. 提亮阴影：+20到+40，找回暗部细节\n4. 压低高光：-20到-30，防止天空/灯光过曝\n5. 黑色色阶：适度右移，让死黑区域变为深灰\n\n第二步：色彩控制\n1. 色温微调：偏黄显温暖（夕阳人像），偏蓝显清新（雪景城市）\n2. 降低饱和度：-5到-15，打造高级灰效果，避免色彩过艳\n3. 增加清晰度/锐化：+10到+20，强化细节，对抗提亮带来的发灰感\n\n第三步：风格滤镜\n1. 胶片风：VSCO CP200滤镜+颗粒感15%\n2. 日系清新风：提亮暗部+降低对比度+色温微偏冷+红色饱和度-15\n3. 电影复古风：压暗高光+色温大幅偏暖+暗角-15+色调分离\n4. 黑金风格：高光压暗+色温偏暖+蓝色饱和度提升+暗角\n\n避坑指南：\n- 慎用美颜：关闭自动磨皮，手动调整参数避免失真\n- 统一滤镜：同组照片用同系列滤镜，保持风格一致\n- 拒绝重度滤镜和过度调色，原生自然质感才是长久高级\n- 肤色保护优先：任何调色都要确保人脸肤色自然",

      "id": 6,
      "title": "手机摄影六大常见错误：90%的人都在犯",
      "category": "手机摄影",
      "content": "拍不好照片，根本不是技术问题，全是常年养成的错误习惯。纠正这六个错误，照片立刻提升一个档次。\n\n错误1：拍照从不点屏幕对焦\n打开相机直接按快门，从不触碰屏幕。\n后果：拍人像脸黑、拍风景天白、拍近物模糊。\n纠正：拍摄前点击屏幕主体位置对焦，长按可锁定对焦与曝光。\n\n错误2：常年开启AI美颜和场景优化\n手机默认开启AI摄影、智能美颜、场景自动识别，从不关闭。\n后果：花草颜色艳得刺眼，天空蓝得假，人脸磨皮过度没细节。\n纠正：关闭AI美颜和场景优化，保留原始画质，后期自己调。\n\n错误3：随意拉伸画面比例为16:9\n随手调成全屏或16:9比例拍照。\n后果：画质被裁剪压缩，边缘模糊，像素直接减半。\n纠正：使用4:3比例（手机传感器原生比例），获得最大画质。\n\n错误4：习惯性数码变焦放大\n拍远处风景人物，直接双指滑动屏幕放大。\n后果：纯数码放大，没有光学画质，颗粒感严重。\n纠正：不用数码变焦，后期裁剪。或使用手机长焦镜头（2x/3x光学变焦）。\n\n错误5：从不开启构图网格线\n关闭网格线，凭感觉取景。\n后果：画面杂乱无章、重心不稳，毫无高级感。\n纠正：打开设置-网格线/参考线，用三分法构图。\n\n错误6：夜间无脑开夜景模式\n晚上拍照必开夜景模式，觉得越开越清晰。\n后果：需要等待好几秒，手抖全糊，画面偏色发灰。\n纠正：日常弱光/室内灯光场景用普通模式即可。极暗环境才开夜景模式，且保持手机静止3-5秒。\n\n额外提醒：\n- 拍照前擦拭镜头，灰尘指纹会导致画面灰蒙蒙\n- 画面不要塞满杂物，主次分明、适当留白才高级\n- 轻微俯拍（10-15度）比平拍更干净整洁，摆脱路人随手拍的廉价感",

      "title": "红枫人像拍摄全攻略：时段、穿搭、构图与调色",
      "category": "人像摄影",
      "content": "秋季红枫人像是摄影爱好者的必拍题材，掌握以下技巧让秋日氛围感大片轻松出炉。\n\n一、三个最佳拍摄时段\n1. 清晨（7-9点）：光线柔和偏暖，游客少，枫叶色彩饱和度高\n2. 黄金时刻（16-18点）：侧逆光打透枫叶，发丝金边效果最佳\n3. 蓝调时刻（日落后10分钟）：冷暖对比，枫叶暖色+天空冷蓝\n\n二、穿搭建议\n- 推荐色系：白色/米色毛衣（与红枫对比）、驼色风衣（秋意浓）、深蓝连衣裙（冷暖对比）\n- 避免红色系（与枫叶融为一体）、大面积黑色（沉闷）\n- 道具：透明雨伞、围巾、书本、咖啡杯\n\n三、构图技巧\n1. 逆光与侧逆光：寻找树林中光斑缝隙，让人物站在光束路径上，发丝被勾勒金边。对脸部点测光+增加0.7-1EV曝光补偿\n2. 极简构图：画面元素控制在三种以内——人物+枫叶+单一背景（天空/湖水/白墙）\n3. 框架构图：利用上方垂落枫枝形成天然画框，确保不遮挡面部\n4. 留白艺术：人物占比不超过1/4，其余为纯色天空或水面\n5. 三分法：人物置于九宫格左/右交叉点，视线方向留白占2/3\n\n四、摆姿建议\n- 整理围巾：假装被风吹乱，单手缓慢拉扯围巾末端\n- 原地转圈：穿裙装时小幅度旋转，连拍锁定最佳帧\n- 向镜头走来：从5米外缓步走近，手臂自然摆动\n- 手捧落叶贴近镜头特写：背景全虚化\n- 摄影师沟通节奏：准备-开始-停\n\n五、后期调色思路\n日系清新风：\n- 曝光微增+0.3，阴影大幅提亮+20至+30\n- 对比度降至-10以下，色温微偏冷-3至-5\n- HSL红色饱和度-15明度+10，绿色转青绿色相+10\n- 添加轻微颗粒5-8模拟胶片质感\n- 肤色保护：人脸发灰需单独提亮橙色明度\n\n电影复古风：\n- 高光压制-20至-30，黑色色阶提至+10制造fade效果\n- 色温大幅偏暖+8至+12，降低红色饱和度防溢出\n- 添加暗角-15，色调分离高光加橙/阴影加青\n- 人物肤色用蒙版单独保护",
      "createdAt": "2026-09-22T09:00:06.000Z"
    },
    {
      "id": 8,
      "title": "压光技巧：用闪光灯压出天空层次感",
      "category": "曝光控制",
      "content": "压光是户外人像摄影的核心技巧，原理是通过快门速度压制背景环境光，同时依赖闪光灯补亮主体，实现天空有层次、人脸不黑、光比平衡的效果。\n\n一、压光原理\n当闪光灯照射范围有限，背景超出覆盖范围时，闪光灯补光的照片看起来背景光被压了下去，这就是压光名称的由来。\n\n二、实操步骤\n第一步：压暗环境\n- 切换M档手动模式\n- 设置小光圈f/8-f/16\n- 设置高快门1/250s-1/2000s\n- 此时天空正常曝光有层次，但人脸偏暗\n\n第二步：闪光灯补亮主体\n- 开启闪光灯，功率1/4-1/1\n- 色温5600K匹配日光\n- 人脸被照亮，与天空形成平衡\n\n三、关键参数注意\n1. 快门速度超过1/250秒时必须开启HSS高速同步，否则画面出现黑边\n2. 闪光灯功率不够时：拉近距离、开全功率、收小光圈补偿\n3. 人脸过曝时：减少闪光补偿、拉远灯位、开大光圈\n\n四、不同光圈的压光效果\n- F2.0大光圈：适合极暗环境，进光量最大\n- F2.8：平衡进光量和清晰度\n- F4.0小光圈：让灯光呈现星芒效果，适合有直射光源的场景\n\n五、手机压光替代方案\n- 手机无法直接压光，但可以模拟效果\n- 使用人像模式+后期降低背景亮度\n- 或拍摄RAW格式后期局部调整\n- 利用自然逆光+反光板补光实现类似效果\n\n六、适用场景\n- 户外晴天人像：压暗天空+补光人脸\n- 海边/沙漠强光环境：控制光比\n- 逆光创意人像：保留天空云层细节同时主体清晰",
      "createdAt": "2026-09-22T09:00:07.000Z"
    },
    {
      "id": 9,
      "title": "10条实用摄影技巧：不烧器材也能出大片",
      "category": "构图技巧",
      "content": "好照片不靠昂贵器材，而靠被忽略的细节和视角。以下10条技巧看完就能用。\n\n1. 换个角度看世界\n蹲下来、趴下去或找制高点。从不寻常的角度拍摄寻常的主体，画面立刻不同。\n\n2. 别总盯着大全景\n大全景交代环境，小细节讲述故事。一片落叶、墙上的裂纹、老人手上的褶皱——这些局部细节才是构成氛围的关键。\n\n3. 几毛钱的小道具解决眩光\n在镜头前放一个干净的咖啡滤纸，或用厚实的咖啡杯套挡光源，能有效减少眩光和雾感，让照片立刻通透。\n\n4. 阴天也能"修"出好光线\n后期软件是后悔药。把色温和色调往想要的方向调，暖色调让人安心，冷色调令人沉静。但修图的最高境界是让人感觉"这光线真美"而非"这滤镜真重"。\n\n5. 告别一键滤镜，手动才是王道\n通用滤镜为了适配所有照片往往很粗暴——细节被磨平、质感被抹杀。用支持手动调节的专业编辑器，让每张照片保留肉眼所见的样子，再注入你想要的生机。\n\n6. 一张CD光盘拍出梦幻彩色光效\n把废弃CD放在镜头底部按快门，光线穿过镀膜折射出迷幻彩色光晕，一张充满艺术感的照片就诞生了。\n\n7. 阴影比你想的更重要\n没有阴影照片会变得扁平。恰到好处的阴影能赋予画面深度和故事性，别怕阴影，学会利用它。\n8. 引导线让画面有方向感\n利用道路、河流、栏杆等线条引导观众视线，多条线汇聚的消失点最有冲击力。\n9. 框架构图增加层次\n用门窗、拱廊、树枝作为前景框架，主体被框在中间，旅行拍摄中透过门框拍远处建筑比直接拍有趣十倍。\n10. 极简构图：少即是多\n找到干净的墙、天空或水面，只放一个主体。背景越干净，主体越突出，高级感很强。",
      "createdAt": "2026-09-23T09:00:00.000Z"
    },
    {
      "id": 10,
      "title": "手机摄影巧用角度与道具：低成本拍出创意大片",
      "category": "手机摄影",
      "content": "手机摄影不靠器材靠创意，掌握角度和道具的运用，普通手机也能拍出惊艳作品。\n\n一、角度的选择\n- 低角度仰拍：贴近地面拍摄，让人物显得高大、建筑更有气势，天空成为干净背景\n- 高角度俯拍：从上方拍摄桌面美食、花卉排列，呈现几何美感\n- 侧角度拍摄：打破正面拍摄的平淡，增加立体感和叙事性\n- 倾斜构图（Dutch Angle）：故意倾斜画面5-15度，制造动感和不安感，适合街拍和运动题材\n\n二、巧用简单道具\n1. 透明塑料袋做柔光罩：套在闪光灯或镜头前，制造梦幻柔光效果\n2. 丝袜罩镜头：在镜头前拉丝袜，可制造梦幻光斑和柔焦效果，不同颜色丝袜呈现不同色调\n3. CD光盘折射彩虹光：放在镜头底部，光线穿过镀膜产生迷幻彩色光晕\n4. 水滴微距镜头：在手机镜头上滴一滴水，可临时充当微距镜头拍摄花蕊、水珠等细节\n5. 黑色纸板做暗角：剪一个圆形黑色纸板放在镜头前，制造自然暗角效果\n6. 偏光太阳镜当偏振镜：把太阳镜放在镜头前，可减少水面/玻璃反光，让天空更蓝\n\n三、创意拍摄手法\n- 长曝光光绘：手机专业模式设快门2-5秒，用手电筒在空中画图案\n- 倒影构图：利用积水、桌面玻璃拍摄对称倒影\n- 透过前景拍摄：用花草、树叶作为前景虚化，增加画面层次\n- 全景模式创意：让人物在全景拍摄中移动，拍出同一人多次出现的趣味画面\n\n四、手机APP调色技巧\n- Snapseed：局部调整、曲线、HDR景观\n- VSCO：胶片滤镜+颗粒感\n- Lightroom Mobile：专业HSL调色\n- 原则：先调曝光和色彩基础，再套滤镜，最后微调细节",
      "createdAt": "2026-09-23T09:00:01.000Z"
    },
    {
      "id": 11,
      "title": "追随拍摄与变焦拍摄：拍出动感与速度感的高级技法",
      "category": "曝光控制",
      "content": "追随拍摄和变焦拍摄是表现动感和速度感的两大高级技法，掌握后能让体育、街拍、赛车等题材的照片脱颖而出。\n\n一、追随拍摄（Panning）\n原理：相机跟随运动主体同步移动并按下快门，主体清晰而背景拉出速度线。\n\n操作步骤：\n1. 快门速度设为1/30s-1/125s（根据主体速度调整，越快的主体用越快的快门）\n2. 对焦模式设为连续自动对焦（AF-C/AI Servo）\n3. 双脚站稳，腰部为轴跟随主体转动\n4. 在主体经过正前方时按下快门，继续跟随不要停\n\n适用场景：\n- 赛车、摩托车：快门1/60s，背景拉出强烈速度线\n- 自行车、滑板：快门1/30s，动感更强\n- 跑步、儿童：快门1/125s，保证主体清晰度\n- 鸟类飞行：快门1/125s-1/250s，背景轻微虚化\n\n常见问题：\n- 主体模糊：跟随速度不够快或快门太慢\n- 背景没拉线：跟随时停顿了，或快门太快\n- 练习方法：在路边拍行驶的汽车，反复练习跟随节奏\n\n二、变焦拍摄（Zoom Burst）\n原理：曝光过程中转动变焦环，画面从中心向外辐射，产生爆炸般的放射效果。\n\n操作步骤：\n1. 使用变焦镜头（如24-105mm）\n2. 快门速度设为1/4s-1/15s（需要三脚架或稳定持握）\n3. 按下快门的同时匀速转动变焦环\n4. 从广角端拧向长焦端（或反向），保持中心稳定\n\n适用场景：\n- 建筑摄影：让静态建筑产生爆炸动感\n- 灯光夜景：路灯变成放射光线，视觉冲击力极强\n- 体育赛事：增强运动员的速度感\n- 创意人像：让人物从画面中心向外辐射\n\n技巧要点：\n- 快门太短效果不明显，太长容易手抖\n- 变焦速度要均匀，不要中途停顿\n- 主体放在画面正中心效果最佳\n- 夜景拍摄时效果最明显，灯光线条更突出\n\n三、两种技法的组合\n追随拍摄+变焦拍摄理论上可以组合，但难度极高，建议分别练习熟练后再尝试。关键是在追随的同时匀速变焦，需要大量练习才能控制好画面效果。",
      "createdAt": "2026-09-23T09:00:02.000Z"
    },
    {
      "id": 12,
      "title": "5个构图技巧专治照片怎么看怎么不对劲",
      "category": "构图技巧",
      "content": "照片总觉得差点意思？问题往往出在构图。以下5个常见构图毛病及纠正方法，照着改就对了。\n\n毛病1：主体不突出，画面杂乱\n原因：画面元素太多，主体被淹没。\n纠正：做减法，画面元素控制在三种以内。用大光圈虚化背景，或移动机位避开杂物。口诀：背景干净，主体突出。\n\n毛病2：水平线歪，画面失稳\n原因：地平线、建筑边缘歪斜，给人不稳定感。\n纠正：开启相机电子水平仪，拍摄时确保水平线与画面边缘平行。口诀：水平要正，画面才稳。\n\n毛病3：不良重叠，逻辑混乱\n原因：主体与背景元素重叠，比如树枝从人物头顶'长出'。\n纠正：变换角度或调整机位，避免主体与背景产生歧义重叠。口诀：重叠要避，逻辑清晰。\n\n毛病4：画面空洞，缺乏层次\n原因：只拍主体没有前景和背景层次。\n纠正：加入前景元素（花草、门窗、栏杆）增加纵深感。利用引导线引导视线。口诀：前景加层，纵深才有。\n\n毛病5：留白不当，画面拥挤或空旷\n原因：留白太少画面拥挤，太多又显空洞。\n纠正：人物视线方向留白占画面2/3，运动方向前方留出空间。极简构图时主体占比不超过1/4。口诀：留白透气，避开杂物。\n\n万能构图口诀：\n横拍拍大景，竖拍拍意境；低角度拍大气，高角度拍线条；日出日落留天空，水面倒影对半分。网格打开，主体靠边；线条引路，前景加层；留白透气，避开杂物。每天拍照前默念一遍，形成肌肉记忆。\n\n记住：法则服务画面，而不是画面迁就法则。三分法不是铁律，但它是最好用的安全网。先拍一百张，再说有没有天赋。",
      "createdAt": "2026-09-24T09:00:00.000Z"
    },

      "id": 13,
      "title": "单人旅行拍照实操技巧：无人帮忙也能出大片",
      "category": "手机摄影",
      "content": "单人旅行最大的顾虑是无人拍照，只能留存单调风景。掌握以下零基础单人拍照技巧，无需他人帮忙，轻松拍出氛围感旅行大片。\n\n一、必备装备\n- 便携手机支架：适配地面、栏杆、台面多种放置场景\n- 蓝牙遥控快门或定时3秒拍摄：轻松拍出全身站姿、行走、回眸动态画面\n- 备用充电宝：长时间定时拍摄耗电较大\n\n二、构图原则\n- 极简原则：人物居中或三分线构图，避免画面拥挤\n- 优先简洁背景：避开杂乱人群，选择空旷墙面、天空、海面作为背景\n- 利用环境线条：道路、桥梁、走廊作为引导线，人物站在线条延伸方向\n- 框架构图：透过门洞、拱桥、树枝拍摄人物，增加层次感\n\n三、光线利用\n- 日出落日：黄金时刻光线柔和温暖，侧逆光打亮发丝\n- 树荫光影：斑驳光影增加画面故事性\n- 街巷光影：利用建筑投影制造明暗对比\n- 室内窗光：靠近窗户利用自然侧光，面部立体感强\n\n四、动态抓拍技巧\n- 行走抓拍：设定定时3秒连拍，从5米外缓步走向镜头\n- 回眸抓拍：背对镜头行走，定时拍摄时自然回头\n- 静态坐姿：坐在台阶、长椅上，手捧咖啡或翻书，自然松弛\n- 背影侧脸：不露脸也能出片，背影+风景=意境感\n\n五、求助路人技巧\n- 礼貌沟通：'不好意思能帮我拍张照吗'\n- 提前说明：简单沟通角度、构图需求（'从低角度拍全身'）\n- 连拍多张：请对方连按几张，增加出片率\n- 表达感谢：拍完展示效果并道谢\n\n六、日常随手抓拍\n- 局部细节：手捧咖啡、脚步特写、翻动的书页\n- 背影侧脸：自然松弛的状态远比刻意摆拍有质感\n- 环境空镜：拍风景、建筑、美食作为旅行记录的补充\n- 全程自助记录，轻松留存专属旅途画面",
      "createdAt": "2026-09-24T09:00:01.000Z"

    {
      "id": 14,
      "title": "2026年手机摄影AI辅助全攻略：从构图指导到AI修图",
      "category": "手机摄影",
      "content": "2026年各大旗舰手机纷纷引入AI拍照指导，让普通人也能一键获得大师级构图建议。以下是AI辅助摄影的完整攻略。\n\n一、善用手机自带功能\n- 开启网格线构图：九宫格辅助线让水平线对齐横线、垂直线对齐竖线，照片工整度立竿见影\n- 人像拍摄三公式：全身照人物放在下方两格，半身照让眉毛卡在三分线上，大头照把脸部置于交叉点\n- 人像模式与焦段切换：90%的人只用主摄盲拍，忽略了人像模式虚化背景、2x/3x长焦裁切杂物、微距镜头放大细节\n- 曝光控制：参照画面最亮区域控制曝光，欠曝后期可找回细节，过曝无法修复\n\n二、AI拍照指导（2026新功能）\n- 新一代折叠旗舰内置AI拍照指导：直接推荐热门机位和构图方案，精准位置导航到最佳拍摄站位\n- 热门城市已适配，未来支持用户上传机位共享\n- AI自动识别拍摄场景（夕阳、文档、美食）并优化参数\n- 拍文档自动矫正去阴影，拍食物自动提亮但保持真实感\n\n三、AI修图新玩法\n- 图生视频：静态照片一键转换为动态视频，为创意表达提供全新可能\n- 动态变焦：给静态照片添加缓慢推拉效果\n- AI消除：一键去除画面中的路人和杂物\n- AI扩图：将画面边缘向外智能扩展\n- AI换天：自动识别天空并替换为不同天气效果\n\n四、人像构图裁剪法则\n- 特写：裁到胸口以上\n- 近景：裁到胯骨以上\n- 中景：裁到大腿以上\n- 九分人像：裁到膝盖以下、脚腕以上\n- 注意：不要裁在关节部位（脖子、腰、膝盖）\n\n五、姿势'破线'原则\n- 膝盖、手臂、头、胯形成高低错落\n- 头和身体不要朝向同一方向\n- 侧身对镜头可减少画面面积\n- 摆胯或岔腿能找到支点\n\n六、场景化小技巧\n- 拍美食：避免闪光灯，利用自然光侧拍加滤镜\n- 拍风景：人物占下方1-2格，蓝天山川占上方六格\n- 拍湖海草坪：占比下方四格\n- 后期是创作的一部分：简单调整滤镜参数即可自然出片",
      "createdAt": "2026-09-24T09:00:02.000Z"

      "content": "2026年7月23日至26日，富士胶片（中国）投资有限公司以1046平方米的超大展台亮相第27届上海国际摄影器材和数码影像展览会，带来数码影像、一次成像、一次性胶片相机、家用打印机及商用影像解决方案，多款新品首秀。\n\n展台中心设置相机时间轴，从1948年延展至今，清晰呈现富士胶片光学传承与技术革新脉络。在售产品包括GFX100 II、GFX100S II、GFX100RF三款亿像素中画幅数码相机，X-H2S、X-T5、X100VI等X系列热门无反机型，以及配套GF、XF双镜头群。\n\nGFX中画幅拍摄体验区搭载中画幅传感器的GFX ETERNA 55电影机吸引众多专业观众驻足，作为IMAX认证体系成员，将中画幅亿像素静态摄影优秀画质引入动态影像领域。\n\n胶片模拟体验区集中展现Velvia、Provia、Astia等20款经典模拟模式。值QuickSnap推出40周年之际，富士胶片特别推出QuickSnap 40周年纪念版一次性胶片相机和QuickSnap Active运动防水一次性胶片相机。\n\n现场还设有未来镜头投票区，14支候选镜头等待观众品鉴挑选，共同决定富士胶片下一款新镜研发方向。",

      "category": "赛事信息",

      "title": "AI技术深度赋能影像产业：2026年影像器材行业核心趋势",
      "category": "行业动态",
      "source": "综合报道",
      "content": "2026年影像器材行业正经历从功能满足向体验引领的深度跃迁，AI技术成为最大驱动力。\n\n四大核心趋势：\n\n1. AI技术深度赋能\nAI对焦、场景识别、智能图像优化及后期辅助已成为主流配置。AI智能构图辅助、AI虚拟影棚、数字人影像创作、智能画质修复、短视频自动剪辑等技术集中落地。从拍摄到后期，AI正在重塑影像创作全流程。\n\n2. 视频化需求全面爆发\n4K/8K高速视频设备、电影镜头、专业收音系统成为市场焦点。全画幅视频专用微单成为消费主流，厂商持续强化长时间录制散热、高帧率RAW内录、电动变焦等视频专项功能。短视频和直播创作需求持续推动器材迭代。\n\n3. 本土产业链日趋成熟\n国产镜头光学素质与自动对焦性能实现关键突破，自动对焦镜头、专业影视灯光、无线传输设备逐步实现自主化。唯卓仕、老蛙、思锐、神牛等国产品牌在各大展会上集中亮相，以自研核心技术实现画质、轻量化、性价比多重突破。\n\n4. 便携化一体化成主流\n全能型相机、小型化设备贴合现代创作习惯。厂商在保持画质的前提下持续缩小体积，满足Vlog创作者和旅行摄影师的便携需求。\n\n行业展望：AI不会取代摄影师，但会用AI的摄影师将取代不用AI的摄影师。影像行业正从器材驱动转向算法驱动，软件定义硬件的时代正在到来。",

/* ===== State ===== */
let state = {
  role: null,
  user: null,
  currentPage: 'dashboard',
  filter: { knowledge: 'all', news: 'all', tips: 'all' },
  search: { knowledge: '', news: '', tips: '' },
  detailId: null
};

/* ===== Utils ===== */
function $(id) { return document.getElementById(id); }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return fmtDate(d) + ' ' + String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
}
function showToast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}
function isAdmin() { return state.role === 'admin'; }

/* ===== Login ===== */
function switchLoginTab(tab) {
  $('tabAdmin').classList.toggle('active', tab === 'admin');
  $('tabGuest').classList.toggle('active', tab === 'guest');
  $('tabReg').classList.toggle('active', tab === 'reg');
  $('adminLoginForm').style.display = tab === 'admin' ? 'block' : 'none';
  $('guestLoginForm').style.display = tab === 'guest' ? 'block' : 'none';
  $('regForm').style.display = tab === 'reg' ? 'block' : 'none';
  $('adminError').textContent = '';
  $('guestError').textContent = '';
  $('regError').textContent = '';
  $('loginHint').style.display = tab === 'admin' ? 'block' : 'none';
}

function adminLogin() {
  const user = $('adminUser').value.trim();
  const pass = $('adminPass').value.trim();
  const data = DB.get();
  if (user === data.settings.adminUser && pass === data.settings.adminPass) {
    state.role = 'admin';
    state.user = user;
    enterApp();
  } else {
    $('adminError').textContent = '账号或密码错误';
  }
}

function submitRegistration() {
  const realName = $('regRealName').value.trim();
  const username = $('regUsername').value.trim();
  const password = $('regPassword').value.trim();
  if (!realName) { $('regError').textContent = '请输入真实姓名'; return; }
  if (!username) { $('regError').textContent = '请设置登录账号'; return; }
  if (!password) { $('regError').textContent = '请设置登录密码'; return; }
  const data = DB.get();
  if (!data.registrations) data.registrations = [];
  data.registrations.push({ id: DB.genId(data), realName, username, password, status: 'pending', createdAt: new Date().toISOString() });
  DB._save(data);
  $('regRealName').value = '';
  $('regUsername').value = '';
  $('regPassword').value = '';
  $('regError').textContent = '';
  showToast('申请已提交，等待管理员审核');
  switchLoginTab('admin');
}

function guestLogin() {
  const code = $('guestCode').value.trim();
  const data = DB.get();
  if (code === data.settings.guestCode) {
    state.role = 'guest';
    state.user = '访客';
    enterApp();
  } else {
    $('guestError').textContent = '邀请码无效';
  }
}

function enterApp() {
  $('loginScreen').style.display = 'none';
  $('app').classList.add('active');
  $('navSettings').style.display = isAdmin() ? 'flex' : 'none';
  $('navRegistrations').style.display = isAdmin() ? 'flex' : 'none';
  $('roleTag').textContent = isAdmin() ? '管理员' : '访客';
  $('currentUser').textContent = state.user;
  updateRegBadge();
  navigate('dashboard');
}

function logout() {
  state = { role: null, user: null, currentPage: 'dashboard',
    filter: { knowledge: 'all', news: 'all', tips: 'all', shop: 'all' },
    search: { knowledge: '', news: '', tips: '' }, detailId: null };
  $('app').classList.remove('active');
  $('loginScreen').style.display = 'flex';
  $('adminUser').value = '';
  $('adminPass').value = '';
  $('guestCode').value = '';
  switchLoginTab('admin');
}

/* ===== Navigation ===== */
function navigate(page) {
  state.currentPage = page;
  state.detailId = null;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderPage(page);
  if (window.innerWidth <= 768) $('sidebar').classList.remove('open');
}

function toggleSidebar() {
  $('sidebar').classList.toggle('open');
}

/* ===== Page Rendering ===== */
function renderPage(page) {
  const main = $('mainContent');
  switch(page) {
    case 'dashboard': renderDashboard(main); break;
    case 'members': renderMembers(main); break;
    case 'points': renderPoints(main); break;
    case 'activities': renderActivities(main); break;
    case 'knowledge': renderKnowledge(main); break;
    case 'news': renderNews(main); break;
    case 'tips': renderTips(main); break;
    case 'shop': renderShop(main); break;
    case 'registrations': renderRegistrations(main); break;
    case 'settings': renderSettings(main); break;
  }
}

/* ===== Dashboard ===== */
function renderDashboard(el) {
  const data = DB.get();
  const totalMembers = data.members.length;
  const activeActivities = data.activities.filter(a => a.status === 'active').length;
  const totalPoints = data.members.reduce((s, m) => s + (m.points || 0), 0);
  const totalKnowledge = data.knowledge.length;
  const totalNews = data.news.length;
  const totalTips = data.tips.length;
  const totalShop = (data.shop || []).length;
  const pendingRegs = (data.registrations || []).filter(r => r.status === 'pending').length;

  el.innerHTML = `
    <div class="welcome-banner">
      <img class="wb-logo" src="https://raw.githubusercontent.com/kaka666-88/photo-club-data/main/photos/club_logo.png" alt="logo" onerror="this.style.display='none'">
      <div class="wb-text">
        <h3>${esc(data.settings.clubName)}</h3>
        <p>${esc(data.settings.clubDesc)}</p>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">&#128101;</div>
        <div class="stat-value">${totalMembers}</div>
        <div class="stat-label">社团成员</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#128197;</div>
        <div class="stat-value">${activeActivities}</div>
        <div class="stat-label">进行中活动</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#127942;</div>
        <div class="stat-value">${totalPoints}</div>
        <div class="stat-label">累计积分</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#127873;</div>
        <div class="stat-value">${totalShop}</div>
        <div class="stat-label">商城商品</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#128218;</div>
        <div class="stat-value">${totalKnowledge}</div>
        <div class="stat-label">知识库条目</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#128240;</div>
        <div class="stat-value">${totalNews}</div>
        <div class="stat-label">行业资讯</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#128294;</div>
        <div class="stat-value">${totalTips}</div>
        <div class="stat-label">摄影技巧</div>
      </div>
      ${isAdmin() && pendingRegs > 0 ? `<div class="stat-card" style="border-color:var(--red);cursor:pointer" onclick="navigate('registrations')">
        <div class="stat-icon">&#9993;</div>
        <div class="stat-value" style="color:var(--red)">${pendingRegs}</div>
        <div class="stat-label">待审申请</div>
      </div>` : ''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-title">&#128197; 近期活动</div>
        ${renderRecentActivities(data)}
      </div>
      <div class="card">
        <div class="card-title">&#127942; 积分前三</div>
        ${renderTopMembers(data)}
      </div>
    </div>
  `;
}

function renderRecentActivities(data) {
  const recent = [...data.activities].sort((a,b) => new Date(b.date||b.createdAt) - new Date(a.date||a.createdAt)).slice(0, 5);
  if (!recent.length) return '<div class="empty-state"><div class="text">暂无活动</div></div>';
  return recent.map(a => `
    <div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:500">${esc(a.title)}</span>
        <span class="tag ${a.status==='active'?'tag-green':a.status==='done'?'tag-blue':'tag-gray'}">${a.status==='active'?'进行中':a.status==='done'?'已结束':'已取消'}</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${fmtDate(a.date)} ${esc(a.location||'')}</div>
    </div>
  `).join('');
}

function renderTopMembers(data) {
  const sorted = [...data.members].sort((a,b) => (b.points||0) - (a.points||0)).slice(0, 3);
  if (!sorted.length) return '<div class="empty-state"><div class="text">暂无成员</div></div>';
  return sorted.map((m, i) => `
    <div class="leaderboard-row">
      <div class="rank rank-${i+1}">${i+1}</div>
      <div class="lb-name">${esc(m.name)}</div>
      <div class="lb-points">${m.points||0}</div>
    </div>
  `).join('');
}

/* ===== Members ===== */
function renderMembers(el) {
  const data = DB.get();
  let html = `
    <div class="page-header">
      <h2>成员管理</h2>
      ${isAdmin() ? '<button class="btn btn-primary" onclick="openMemberModal()">&#43; 添加成员</button>' : ''}
    </div>
    <div class="search-bar">
      <input type="text" placeholder="搜索成员姓名..." oninput="filterMembers(this.value)">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>姓名</th><th>角色</th><th>加入日期</th><th>积分</th><th>联系方式</th>${isAdmin()?'<th>操作</th>':''}
        </tr></thead>
        <tbody id="membersBody">
          ${renderMembersRows(data.members)}
        </tbody>
      </table>
    </div>
  `;
  el.innerHTML = html;
}

function renderMembersRows(members) {
  if (!members.length) return '<tr><td colspan="6"><div class="empty-state"><div class="text">暂无成员，点击"添加成员"开始</div></div></td></tr>';
  return members.map(m => `
    <tr>
      <td style="font-weight:500">${esc(m.name)}</td>
      <td><span class="tag ${m.role==='core'?'tag-amber':'tag-gray'}">${m.role==='core'?'核心成员':'普通成员'}</span></td>
      <td>${fmtDate(m.joinDate)}</td>
      <td style="font-weight:600;color:var(--accent)">${m.points||0}</td>
      <td>${esc(m.contact||'-')}</td>
      ${isAdmin() ? `<td>
        <button class="btn btn-sm" onclick="openMemberModal(${m.id})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMember(${m.id})">删除</button>
      </td>` : ''}
    </tr>
  `).join('');
}

function filterMembers(keyword) {
  const data = DB.get();
  const filtered = data.members.filter(m => m.name.toLowerCase().includes(keyword.toLowerCase()));
  $('membersBody').innerHTML = renderMembersRows(filtered);
}

function openMemberModal(id) {
  const data = DB.get();
  const m = id ? data.members.find(x => x.id === id) : null;
  $('modalContent').innerHTML = `
    <h3>${m ? '编辑成员' : '添加成员'}</h3>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="mName" value="${m?esc(m.name):''}" placeholder="成员姓名">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>角色</label>
        <select id="mRole">
          <option value="member" ${m&&m.role==='member'?'selected':''}>普通成员</option>
          <option value="core" ${m&&m.role==='core'?'selected':''}>核心成员</option>
        </select>
      </div>
      <div class="form-group">
        <label>加入日期</label>
        <input type="date" id="mJoinDate" value="${m?fmtDate(m.joinDate):fmtDate(new Date())}">
      </div>
    </div>
    <div class="form-group">
      <label>联系方式（微信/手机）</label>
      <input type="text" id="mContact" value="${m?esc(m.contact||''):''}" placeholder="选填">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveMember(${id||0})">保存</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

function saveMember(id) {
  const name = $('mName').value.trim();
  if (!name) { showToast('请输入姓名', true); return; }
  const role = $('mRole').value;
  const joinDate = $('mJoinDate').value;
  const contact = $('mContact').value.trim();
  DB.update(data => {
    if (id) {
      const m = data.members.find(x => x.id === id);
      if (m) { m.name = name; m.role = role; m.joinDate = joinDate; m.contact = contact; }
    } else {
      data.members.push({ id: DB.genId(data), name, role, joinDate, contact, points: 0, pointsHistory: [] });
    }
  });
  closeModal();
  renderPage('members');
  showToast(id ? '成员已更新' : '成员已添加');
}

function deleteMember(id) {
  if (!confirm('确认删除该成员？相关积分记录也会清除。')) return;
  DB.update(data => {
    data.members = data.members.filter(m => m.id !== id);
  });
  renderPage('members');
  showToast('成员已删除');
}

/* ===== Points ===== */
function renderPoints(el) {
  const data = DB.get();
  const sorted = [...data.members].sort((a,b) => (b.points||0) - (a.points||0));
  let html = `
    <div class="page-header">
      <h2>积分排行</h2>
      ${isAdmin() ? '<button class="btn btn-primary" onclick="openPointsModal()">&#43; 积分变动</button>' : ''}
    </div>
  `;
  if (!sorted.length) {
    html += '<div class="empty-state"><div class="icon">&#127942;</div><div class="text">暂无成员数据</div></div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>排名</th><th>姓名</th><th>角色</th><th>积分</th>';
    if (isAdmin()) html += '<th>操作</th>';
    html += '</tr></thead><tbody>';
    sorted.forEach((m, i) => {
      html += `<tr>
        <td><div class="rank rank-${i<3?(i+1):'other'}" style="display:inline-flex">${i+1}</div></td>
        <td style="font-weight:500">${esc(m.name)}</td>
        <td><span class="tag ${m.role==='core'?'tag-amber':'tag-gray'}">${m.role==='core'?'核心':'普通'}</span></td>
        <td style="font-weight:700;color:var(--accent);font-size:16px">${m.points||0}</td>
        ${isAdmin() ? `<td><button class="btn btn-sm" onclick="openPointsHistory(${m.id})">记录</button></td>` : ''}
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  el.innerHTML = html;
}

function openPointsModal() {
  const data = DB.get();
  if (!data.members.length) { showToast('请先添加成员', true); return; }
  const options = data.members.map(m => `<option value="${m.id}">${esc(m.name)} (当前${m.points||0}分)</option>`).join('');
  $('modalContent').innerHTML = `
    <h3>积分变动</h3>
    <div class="form-group">
      <label>成员</label>
      <select id="pMember">${options}</select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>变动类型</label>
        <select id="pType" onchange="togglePointsSign()">
          <option value="add">增加 (+)</option>
          <option value="deduct">扣减 (-)</option>
        </select>
      </div>
      <div class="form-group">
        <label>分值</label>
        <input type="number" id="pValue" value="1" min="1" style="width:100%">
      </div>
    </div>
    <div class="form-group">
      <label>原因 / 关联活动</label>
      <input type="text" id="pReason" placeholder="如：参加外拍活动、投稿被选登等">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="savePoints()">确认</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

function savePoints() {
  const memberId = parseInt($('pMember').value);
  const type = $('pType').value;
  const value = parseInt($('pValue').value);
  const reason = $('pReason').value.trim() || '手动调整';
  if (!value || value <= 0) { showToast('分值必须大于0', true); return; }
  const delta = type === 'add' ? value : -value;
  DB.update(data => {
    const m = data.members.find(x => x.id === memberId);
    if (m) {
      m.points = (m.points || 0) + delta;
      if (!m.pointsHistory) m.pointsHistory = [];
      m.pointsHistory.unshift({ date: new Date().toISOString(), delta, reason, balance: m.points });
    }
  });
  closeModal();
  renderPage('points');
  showToast('积分已更新');
}

function openPointsHistory(memberId) {
  const data = DB.get();
  const m = data.members.find(x => x.id === memberId);
  if (!m) return;
  const history = m.pointsHistory || [];
  $('modalContent').innerHTML = `
    <h3>${esc(m.name)} - 积分记录</h3>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">当前积分: <span style="font-weight:700;color:var(--accent);font-size:18px">${m.points||0}</span></div>
    ${history.length ? history.map(h => `
      <div class="points-history-item">
        <div>
          <div>${esc(h.reason)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${fmtDateTime(h.date)}</div>
        </div>
        <div class="points-delta ${h.delta>0?'positive':'negative'}">${h.delta>0?'+':''}${h.delta}</div>
      </div>
    `).join('') : '<div class="empty-state"><div class="text">暂无积分变动记录</div></div>'}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

/* ===== Activities ===== */
function renderActivities(el) {
  const data = DB.get();
  let html = `
    <div class="page-header">
      <h2>活动与任务</h2>
      ${isAdmin() ? '<button class="btn btn-primary" onclick="openActivityModal()">&#43; 发布活动</button>' : ''}
    </div>
    <div class="filter-tabs">
      <div class="filter-tab active" onclick="filterActivities('all', this)">全部</div>
      <div class="filter-tab" onclick="filterActivities('active', this)">进行中</div>
      <div class="filter-tab" onclick="filterActivities('done', this)">已结束</div>
      <div class="filter-tab" onclick="filterActivities('cancelled', this)">已取消</div>
    </div>
    <div class="content-list" id="activitiesList">
      ${renderActivitiesList(data.activities, 'all')}
    </div>
  `;
  el.innerHTML = html;
}

let activityFilter = 'all';
function filterActivities(status, btn) {
  activityFilter = status;
  document.querySelectorAll('.filter-tabs .filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const data = DB.get();
  $('activitiesList').innerHTML = renderActivitiesList(data.activities, status);
}

function renderActivitiesList(activities, filter) {
  let list = activities;
  if (filter !== 'all') list = activities.filter(a => a.status === filter);
  list = [...list].sort((a,b) => new Date(b.date||b.createdAt) - new Date(a.date||a.createdAt));
  if (!list.length) return '<div class="empty-state"><div class="icon">&#128197;</div><div class="text">暂无活动</div></div>';
  return list.map(a => {
    const tasks = a.tasks || [];
    const doneTasks = tasks.filter(t => t.status === 'done').length;
    const statusMap = { active: ['进行中','tag-green'], done: ['已结束','tag-blue'], cancelled: ['已取消','tag-gray'] };
    const [statusText, statusClass] = statusMap[a.status] || ['未知','tag-gray'];
    return `
      <div class="content-item">
        <div class="item-header">
          <div>
            <div class="item-title">${esc(a.title)}</div>
            <div class="item-meta">
              <span>&#128197; ${fmtDate(a.date)}</span>
              ${a.location ? `<span>&#128205; ${esc(a.location)}</span>` : ''}
              <span class="tag ${statusClass}">${statusText}</span>
              ${tasks.length ? `<span>&#9745; ${doneTasks}/${tasks.length} 任务完成</span>` : ''}
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm" onclick="viewActivity(${a.id})">详情</button>
            ${isAdmin() ? `
              <button class="btn btn-sm" onclick="openActivityModal(${a.id})">编辑</button>
              <button class="btn btn-sm btn-danger" onclick="deleteActivity(${a.id})">删除</button>
            ` : ''}
          </div>
        </div>
        ${a.description ? `<div class="item-body">${esc(a.description)}</div>` : ''}
        ${tasks.length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">任务清单</div>
          ${tasks.map(t => {
            const ts = t.status==='done'?'<span class="status-dot done"></span>已完成':t.status==='pending'?'<span class="status-dot pending"></span>待处理':'<span class="status-dot active"></span>进行中';
            return `<div style="font-size:12px;padding:3px 0;display:flex;justify-content:space-between">
              <span>${esc(t.title)} ${t.assignee?'- '+esc(t.assignee):''}</span>
              <span style="color:var(--text-muted)">${ts} ${t.points?`(${t.points}分)`:''}</span>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>
    `;
  }).join('');
}

function openActivityModal(id) {
  const data = DB.get();
  const a = id ? data.activities.find(x => x.id === id) : null;
  const tasks = a ? (a.tasks || []) : [];
  $('modalContent').innerHTML = `
    <h3>${a ? '编辑活动' : '发布活动'}</h3>
    <div class="form-group">
      <label>活动名称</label>
      <input type="text" id="aTitle" value="${a?esc(a.title):''}" placeholder="如：秋季外拍活动">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="aDate" value="${a?fmtDate(a.date):fmtDate(new Date())}">
      </div>
      <div class="form-group">
        <label>地点</label>
        <input type="text" id="aLocation" value="${a?esc(a.location||''):''}" placeholder="活动地点">
      </div>
    </div>
    <div class="form-group">
      <label>状态</label>
      <select id="aStatus">
        <option value="active" ${a&&a.status==='active'?'selected':''}>进行中</option>
        <option value="done" ${a&&a.status==='done'?'selected':''}>已结束</option>
        <option value="cancelled" ${a&&a.status==='cancelled'?'selected':''}>已取消</option>
      </select>
    </div>
    <div class="form-group">
      <label>活动描述</label>
      <textarea id="aDesc" placeholder="活动内容、要求、注意事项等">${a?esc(a.description||''):''}</textarea>
    </div>
    <div class="form-group">
      <label>任务清单</label>
      <div id="taskList">${tasks.map((t,i) => renderTaskRow(t,i)).join('')}</div>
      <button class="btn btn-sm" style="margin-top:8px" onclick="addTaskRow()">&#43; 添加任务</button>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveActivity(${id||0})">保存</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

function renderTaskRow(t, i) {
  return `<div class="form-row" id="taskRow${i}" style="margin-bottom:6px;align-items:flex-end">
    <div class="form-group" style="flex:2">
      <input type="text" placeholder="任务名称" value="${esc(t.title||'')}" id="taskTitle${i}">
    </div>
    <div class="form-group" style="flex:1">
      <input type="text" placeholder="负责人" value="${esc(t.assignee||'')}" id="taskAssignee${i}">
    </div>
    <div class="form-group" style="flex:0 0 70px">
      <input type="number" placeholder="积分" value="${t.points||''}" id="taskPoints${i}" style="width:100%">
    </div>
    <div class="form-group" style="flex:0 0 100px">
      <select id="taskStatus${i}">
        <option value="pending" ${t.status==='pending'?'selected':''}>待处理</option>
        <option value="active" ${t.status==='active'?'selected':''}>进行中</option>
        <option value="done" ${t.status==='done'?'selected':''}>已完成</option>
      </select>
    </div>
    <button class="btn btn-sm btn-danger" style="flex:0 0 auto;margin-bottom:16px" onclick="document.getElementById('taskRow${i}').remove()">删</button>
  </div>`;
}

let taskCounter = 100;
function addTaskRow() {
  const i = taskCounter++;
  const div = document.createElement('div');
  div.innerHTML = renderTaskRow({}, i);
  $('taskList').appendChild(div.firstChild);
}

function saveActivity(id) {
  const title = $('aTitle').value.trim();
  if (!title) { showToast('请输入活动名称', true); return; }
  const date = $('aDate').value;
  const location = $('aLocation').value.trim();
  const status = $('aStatus').value;
  const description = $('aDesc').value.trim();
  const tasks = [];
  const taskRows = document.querySelectorAll('[id^="taskRow"]');
  taskRows.forEach(row => {
    const idx = row.id.replace('taskRow','');
    const tTitle = row.querySelector(`#taskTitle${idx}`);
    if (tTitle && tTitle.value.trim()) {
      tasks.push({
        title: tTitle.value.trim(),
        assignee: row.querySelector(`#taskAssignee${idx}`)?.value.trim() || '',
        points: parseInt(row.querySelector(`#taskPoints${idx}`)?.value) || 0,
        status: row.querySelector(`#taskStatus${idx}`)?.value || 'pending'
      });
    }
  });
  DB.update(data => {
    if (id) {
      const a = data.activities.find(x => x.id === id);
      if (a) { a.title = title; a.date = date; a.location = location; a.status = status; a.description = description; a.tasks = tasks; }
    } else {
      data.activities.push({ id: DB.genId(data), title, date, location, status, description, tasks, createdAt: new Date().toISOString() });
    }
  });
  closeModal();
  renderPage('activities');
  showToast(id ? '活动已更新' : '活动已发布');
}

function deleteActivity(id) {
  if (!confirm('确认删除该活动？')) return;
  DB.update(data => { data.activities = data.activities.filter(a => a.id !== id); });
  renderPage('activities');
  showToast('活动已删除');
}

function viewActivity(id) {
  const data = DB.get();
  const a = data.activities.find(x => x.id === id);
  if (!a) return;
  const tasks = a.tasks || [];
  const statusMap = { active: ['进行中','tag-green'], done: ['已结束','tag-blue'], cancelled: ['已取消','tag-gray'] };
  const [st, sc] = statusMap[a.status] || ['未知','tag-gray'];
  $('modalContent').innerHTML = `
    <h3>${esc(a.title)}</h3>

  const items = data.shop || [];

    html += '<div class="shop-grid">';

              <div class="shop-stock">${stock > 0 ? '库存 ' + stock : '已兑完'}</div>

          </div>
          <div class="shop-actions">
            ${isAdmin() ? `

    </div>
    <div class="form-group">
      <label>商品描述</label>
      <textarea id="shopDesc" placeholder="商品描述">${item?esc(item.description||''):''}</textarea>
    </div>
    <div class="form-group">
      <label>商品图片链接（选填）</label>
      <input type="text" id="shopImg" value="${item?esc(item.img||''):''}" placeholder="https://..." oninput="previewShopImg(this.value)">
      <img id="shopImgPreview" class="img-preview" style="display:none">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveShopItem(${id||0})">保存</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
  if (item && item.img) previewShopImg(item.img);
}

function previewShopImg(url) {
  const img = $('shopImgPreview');
  if (url) { img.src = url; img.style.display = 'block'; } else { img.style.display = 'none'; }
}

function saveShopItem(id) {
  const name = $('shopName').value.trim();
  if (!name) { showToast('请输入商品名称', true); return; }
  const pointsCost = parseInt($('shopPoints').value) || 10;
  const stock = parseInt($('shopStock').value);
  const description = $('shopDesc').value.trim();
  const img = $('shopImg').value.trim();
  DB.update(data => {
    if (!data.shop) data.shop = [];
    if (id) {
      const item = data.shop.find(x => x.id === id);
      if (item) { item.name = name; item.pointsCost = pointsCost; item.stock = stock; item.description = description; item.img = img; }
    } else {
      data.shop.push({ id: DB.genId(data), name, pointsCost, stock, description, img, redeemed: 0 });
    }
  });
  closeModal();
  renderPage('shop');
  showToast(id ? '商品已更新' : '商品已添加');
}

function deleteShopItem(id) {
  if (!confirm('确认删除该商品？')) return;
  DB.update(data => { data.shop = (data.shop || []).filter(x => x.id !== id); });
  renderPage('shop');
  showToast('商品已删除');
}

function redeemItem(id) {
  const data = DB.get();
  const item = (data.shop || []).find(x => x.id === id);
  if (!item) return;
  if (item.stock != null && item.stock <= 0) { showToast('该商品已兑完', true); return; }
  if (!confirm(`确认兑换「${item.name}」？将消耗 ${item.pointsCost} 积分。`)) return;
  DB.update(d => {
    const it = (d.shop || []).find(x => x.id === id);
    if (it) {
      if (it.stock != null) it.stock--;
      it.redeemed = (it.redeemed || 0) + 1;
    }
  });
  showToast('兑换成功！请联系管理员领取商品');
  renderPage('shop');
}

/* ===== Registrations ===== */
function renderRegistrations(el) {
  const data = DB.get();
  const regs = data.registrations || [];
  const pending = regs.filter(r => r.status === 'pending');
  const reviewed = regs.filter(r => r.status !== 'pending');
  let html = `
    <div class="page-header">
      <h2>注册申请</h2>
    </div>
  `;
  if (pending.length) {
    html += `<div class="card"><div class="card-title">&#9888; 待审核 (${pending.length})</div>`;
    pending.forEach(r => {
      html += `
        <div class="reg-item">
          <div class="reg-info">
            <div class="reg-name">${esc(r.realName)} <span style="color:var(--text-muted);font-weight:400;font-size:12px">/ ${esc(r.username)}</span></div>
            <div class="reg-meta">申请时间: ${fmtDateTime(r.createdAt)}</div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm btn-primary" onclick="approveReg(${r.id})">通过</button>
            <button class="btn btn-sm btn-danger" onclick="rejectReg(${r.id})">拒绝</button>
          </div>
        </div>
      `;
    });
    html += '</div>';
  }
  if (reviewed.length) {
    html += `<div class="card"><div class="card-title">&#128221; 已处理</div>`;
    reviewed.forEach(r => {
      const statusText = r.status === 'approved' ? '已通过' : '已拒绝';
      const statusClass = r.status === 'approved' ? 'tag-green' : 'tag-red';
      html += `
        <div class="reg-item">
          <div class="reg-info">
            <div class="reg-name">${esc(r.realName)} <span style="color:var(--text-muted);font-weight:400;font-size:12px">/ ${esc(r.username)}</span></div>
            <div class="reg-meta">处理时间: ${fmtDateTime(r.reviewedAt || r.createdAt)}</div>
          </div>
          <span class="tag ${statusClass}">${statusText}</span>
        </div>
      `;
    });
    html += '</div>';
  }
  if (!regs.length) {
    html += '<div class="empty-state"><div class="icon">&#9993;</div><div class="text">暂无注册申请</div></div>';
  }
  el.innerHTML = html;
}

function approveReg(id) {
  const data = DB.get();
  const reg = (data.registrations || []).find(r => r.id === id);
  if (!reg) return;
  DB.update(d => {
    const r = (d.registrations || []).find(x => x.id === id);
    if (r) { r.status = 'approved'; r.reviewedAt = new Date().toISOString(); }
    d.members.push({ id: DB.genId(d), name: reg.realName, role: 'member', joinDate: new Date().toISOString().slice(0,10), contact: '', points: 0, pointsHistory: [] });
  });
  updateRegBadge();
  renderPage('registrations');
  showToast('已通过申请，成员已添加');
}

function rejectReg(id) {
  DB.update(d => {
    const r = (d.registrations || []).find(x => x.id === id);
    if (r) { r.status = 'rejected'; r.reviewedAt = new Date().toISOString(); }
  });
  updateRegBadge();
  renderPage('registrations');
  showToast('已拒绝申请');
}

function updateRegBadge() {
  const data = DB.get();
  const count = (data.registrations || []).filter(r => r.status === 'pending').length;
  const badge = $('regBadge');
  if (count > 0) { badge.textContent = count; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
}

/* ===== Settings ===== */
function renderSettings(el) {
  const data = DB.get();
  el.innerHTML = `
    <div class="page-header">
      <h2>系统设置</h2>
    </div>
    <div class="card">
      <div class="card-title">管理员账号</div>
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" id="setAdminUser" value="${esc(data.settings.adminUser)}">
      </div>
      <div class="form-group">
        <label>管理密码</label>
        <input type="text" id="setAdminPass" value="${esc(data.settings.adminPass)}">
      </div>
    </div>
    <div class="card">
      <div class="card-title">访客邀请码</div>
      <div class="form-group">
        <label>邀请码（微信好友凭此码进入浏览）</label>
        <input type="text" id="setGuestCode" value="${esc(data.settings.guestCode)}">
      </div>
    </div>
    <div class="card">
      <div class="card-title">社团信息</div>
      <div class="form-group">
        <label>社团名称</label>
        <input type="text" id="setClubName" value="${esc(data.settings.clubName)}">
      </div>
      <div class="form-group">
        <label>社团简介</label>
        <input type="text" id="setClubDesc" value="${esc(data.settings.clubDesc)}">
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
      <button class="btn btn-danger" onclick="resetData()">重置全部数据</button>
    </div>
  `;
}

function saveSettings() {
  const adminUser = $('setAdminUser').value.trim();
  const adminPass = $('setAdminPass').value.trim();
  const guestCode = $('setGuestCode').value.trim();
  const clubName = $('setClubName').value.trim();
  const clubDesc = $('setClubDesc').value.trim();
  if (!adminUser || !adminPass || !guestCode) { showToast('账号、密码、邀请码不能为空', true); return; }
  DB.update(data => {
    data.settings = { adminUser, adminPass, guestCode, clubName: clubName || '光影社', clubDesc: clubDesc || '' };
  });
  showToast('设置已保存');
}

function resetData() {
  if (!confirm('确认重置全部数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有成员、活动、商城、知识库、资讯、技巧数据将被清空！')) return;
  localStorage.removeItem('photoClubDB');
  DB.init();
  showToast('数据已重置');
  navigate('dashboard');
}

/* ===== Modal ===== */
function closeModal() {
  $('modalOverlay').classList.remove('active');
}
$('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ===== Init ===== */
DB.init();
</script>
</body>
</html>
