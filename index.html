}

/* ===== Tips ===== */
function renderTips(el) {
  const data = store.data;
  const categories = [...new Set(data.tips.map(t => t.category).filter(Boolean))];
  let html = `
    <div class="page-header">
      <h2>摄影技巧</h2>
      ${isAdmin() ? '<button class="btn btn-primary" onclick="openTipsModal()">&#43; 发布技巧</button>' : ''}
    </div>
    <div class="search-bar">
      <input type="text" placeholder="搜索技巧..." value="${esc(state.search.tips)}" oninput="state.search.tips=this.value;renderTipsList()">
      <select onchange="state.filter.tips=this.value;renderTipsList()">
        <option value="all" ${state.filter.tips==='all'?'selected':''}>全部分类</option>
        ${categories.map(c => `<option value="${esc(c)}" ${state.filter.tips===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
    </div>
    <div class="content-list" id="tipsList">
      ${renderTipsListInner(data)}
    </div>
  `;
  el.innerHTML = html;
}

function renderTipsList() {
  const data = store.data;
  $('tipsList').innerHTML = renderTipsListInner(data);
}

function renderTipsListInner(data) {
  let list = data.tips;
  if (state.filter.tips !== 'all') list = list.filter(t => t.category === state.filter.tips);
  if (state.search.tips) {
    const kw = state.search.tips.toLowerCase();
    list = list.filter(t => (t.title||'').toLowerCase().includes(kw) || (t.content||'').toLowerCase().includes(kw));
  }
  list = [...list].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (!list.length) return '<div class="empty-state"><div class="icon">&#128294;</div><div class="text">暂无技巧</div></div>';
  return list.map(t => `
    <div class="content-item">
      <div class="item-header">
        <div>
          <div class="item-title">${esc(t.title)}</div>
          <div class="item-meta">
            ${t.category ? `<span class="tag tag-green">${esc(t.category)}</span>` : ''}
            <span>&#128197; ${fmtDate(t.createdAt)}</span>
          </div>
        </div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="viewTips(${t.id})">查看</button>
          ${isAdmin() ? `
            <button class="btn btn-sm" onclick="openTipsModal(${t.id})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteTips(${t.id})">删除</button>
          ` : ''}
        </div>
      </div>
      <div class="item-body">${esc((t.content||'').substring(0,150))}${(t.content||'').length>150?'...':''}</div>
    </div>
  `).join('');
}

function openTipsModal(id) {
  const data = store.data;
  const t = id ? data.tips.find(x => x.id === id) : null;
  const presetCats = ['构图技巧','曝光控制','人像摄影','风光摄影','后期修图','器材使用','手机摄影'];
  const existingCats = [...new Set(data.tips.map(x => x.category).filter(Boolean))];
  const allCats = [...new Set([...presetCats, ...existingCats])];
  $('modalContent').innerHTML = `
    <h3>${t ? '编辑技巧' : '发布技巧'}</h3>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="tTitle" value="${t?esc(t.title):''}" placeholder="技巧标题">
    </div>
    <div class="form-group">
      <label>分类</label>
      <select id="tCategory">
        ${allCats.map(c => `<option value="${esc(c)}" ${t&&t.category===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="tContent" style="min-height:200px" placeholder="技巧内容，支持多行文本">${t?esc(t.content||''):''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTips(${id||0})">保存</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

async function saveTips(id) {
  const title = $('tTitle').value.trim();
  if (!title) { showToast('请输入标题', true); return; }
  const category = $('tCategory').value;
  const content = $('tContent').value.trim();
  try {
    if (id) {
      await API.updateTips(id, { title, category, content });
    } else {
      await API.createTips({ title, category, content });
    }
    await store.loadTips();
    closeModal();
    renderPage('tips');
    showToast(id ? '技巧已更新' : '技巧已发布');
  } catch(e) {
    showToast(e.message, true);
  }
}

function viewTips(id) {
  const data = store.data;
  const t = data.tips.find(x => x.id === id);
  if (!t) return;
  $('modalContent').innerHTML = `
    <h3>${esc(t.title)}</h3>
    <div class="detail-meta">
      ${t.category ? `<span class="tag tag-green">${esc(t.category)}</span>` : ''}
      <span>&#128197; ${fmtDate(t.createdAt)}</span>
    </div>
    <div class="detail-body">${esc(t.content||'')}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  `;
  $('modalOverlay').classList.add('active');
}

async function deleteTips(id) {
  if (!confirm('确认删除该技巧？')) return;
  try {
    await API.deleteTips(id);
    await store.loadTips();
    renderPage('tips');
    showToast('技巧已删除');
  } catch(e) {
    showToast(e.message, true);
  }
}

/* ===== Settings ===== */
async function renderSettings(el) {
  let s = store.data.settings;
  // Fetch full settings (with admin credentials) if admin
  if (isAdmin()) {
    try {
      const full = await API.getFullSettings();
      s = normalizeSettings(full);
      store.data.settings = s;
    } catch(e) { /* use cached */ }
  }
  el.innerHTML = `
    <div class="page-header">
      <h2>系统设置</h2>
    </div>
    <div class="card">
      <div class="card-title">管理员账号</div>
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" id="setAdminUser" value="${esc(s.adminUser)}">
      </div>
      <div class="form-group">
        <label>管理密码</label>
        <input type="text" id="setAdminPass" value="${esc(s.adminPass)}">
      </div>
    </div>
    <div class="card">
      <div class="card-title">访客邀请码</div>
      <div class="form-group">
        <label>邀请码（微信好友凭此码进入浏览）</label>
        <input type="text" id="setGuestCode" value="${esc(s.guestCode)}">
      </div>
    </div>
    <div class="card">
      <div class="card-title">社团信息</div>
      <div class="form-group">
        <label>社团名称</label>
        <input type="text" id="setClubName" value="${esc(s.clubName)}">
      </div>
      <div class="form-group">
        <label>社团简介</label>
        <input type="text" id="setClubDesc" value="${esc(s.clubDesc)}">
      </div>
    </div>
    <div class="card">
      <div class="card-title">GitHub 云端同步</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">配置 GitHub 仓库实现多设备数据共享。访客无需 Token，仅管理员写入需要 Token。</div>
      <div class="form-group">
        <label>GitHub 用户名</label>
        <input type="text" id="setGhOwner" value="${esc(ghCfg().owner || '')}" placeholder="如 your-name">
      </div>
      <div class="form-group">
        <label>仓库名</label>
        <input type="text" id="setGhRepo" value="${esc(ghCfg().repo || '')}" placeholder="如 photo-club-data">
      </div>
      <div class="form-group">
        <label>分支名</label>
        <input type="text" id="setGhBranch" value="${esc(ghCfg().branch || 'main')}" placeholder="如 main">
      </div>
      <div class="form-group">
        <label>Personal Access Token（仅管理员需要）</label>
        <input type="password" id="setGhToken" value="${esc(ghCfg().token || '')}" placeholder="ghp_...">
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="saveGithubConfig()">保存配置</button>
        <button class="btn btn-primary" onclick="syncFromCloud()">立即同步</button>
        <button class="btn btn-primary" onclick="generateShareFile()">生成共享文件</button>
      </div>
      <div id="syncStatus" style="font-size:12px;color:var(--text-secondary);margin-top:8px"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
    </div>
  `;
}

async function saveSettings() {
  const adminUser = $('setAdminUser').value.trim();
  const adminPass = $('setAdminPass').value.trim();
  const guestCode = $('setGuestCode').value.trim();
  const clubName = $('setClubName').value.trim();
  const clubDesc = $('setClubDesc').value.trim();
  if (!adminUser || !adminPass) { showToast('账号和密码不能为空', true); return; }
  try {
    await API.updateSettings({
      admin_user: adminUser, admin_pass: adminPass, guest_code: guestCode,
      club_name: clubName || '光影社', club_desc: clubDesc || ''
    });
    store.data.settings = { adminUser, adminPass, guestCode, clubName: clubName || '光影社', clubDesc: clubDesc || '' };
    // 同步更新记住的管理员密码
    localStorage.setItem('photoClubAdminUser', adminUser);
    localStorage.setItem('photoClubAdminPass', adminPass);
    showToast('设置已保存');
  } catch(e) {
    showToast(e.message, true);
  }
}

function saveGithubConfig() {
  const owner = $('setGhOwner').value.trim();
  const repo = $('setGhRepo').value.trim();
  const branch = $('setGhBranch').value.trim();
  const token = $('setGhToken').value.trim();
  if (!owner || !repo || !branch) { showToast('用户名、仓库名、分支不能为空', true); return; }
  let existing = {};
  try { existing = JSON.parse(localStorage.getItem('photoClubGithub') || '{}'); } catch(e) {}
  const finalToken = token || existing.token || '';
  localStorage.setItem('photoClubGithub', JSON.stringify({ owner, repo, branch, token: finalToken }));
  API._remoteSha = null;
  showToast('GitHub 配置已保存，正在同步...');
  API._syncFromRemote().then(() => {
    if (state.role) {
      store.loadAll().then(() => renderPage(state.currentPage));
    }
    updateSyncStatus();
  }).catch(() => {
    showToast('同步失败，请检查配置或网络', true);
  });
}

function syncFromCloud() {
  showToast('正在从云端同步...');
  API._syncFromRemote().then((changed) => {
    showToast(changed ? '同步完成，数据已更新' : '同步完成，数据无变化');
    if (state.role) {
      store.loadAll().then(() => renderPage(state.currentPage));
    }
    updateSyncStatus();
  }).catch(() => {
    showToast('同步失败，请检查配置或网络', true);
  });
}

function updateSyncStatus() {
  const el = $('syncStatus');
  if (!el) return;
  if (API._lastSync) {
    const time = new Date(API._lastSync).toLocaleTimeString();
    el.textContent = '上次同步: ' + time + (API._isConfigured() ? '' : '（未配置）');
  } else {
    el.textContent = API._isConfigured() ? '等待首次同步...' : '未配置 GitHub';
  }
}

function generateShareFile() {
  try {
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const cfg = ghCfg();
    if (!cfg.owner || !cfg.repo || !cfg.branch) { showToast('请先保存 GitHub 配置', true); return; }
    const cloudConfig = JSON.stringify({ owner: cfg.owner, repo: cfg.repo, branch: cfg.branch });
    html = html.replace('const CLOUD_CONFIG = {"owner":"kaka666-88","repo":"photo-club-data","branch":"main"};', 'const CLOUD_CONFIG = ' + cloudConfig + ';');
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '光影社-共享版.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('共享文件已生成下载');
  } catch(e) {
    showToast('生成失败: ' + e.message, true);
  }
}

/* ===== Modal ===== */
function closeModal() {
  $('modalOverlay').classList.remove('active');
}
$('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ===== Auto Login (restore session) ===== */
async function tryRestoreSession() {
  if (!API.token) return false;
  const session = (API._data.sessions || {})[API.token];
  if (!session) {
    API.token = "";
    localStorage.removeItem("photoClubToken");
    return false;
  }
  state.role = session.role;
  state.user = session.user;
  await store.loadAll();
  enterApp();
  return true;
}

/* ===== Init ===== */
(async function init() {
  API._init();
  await API._syncFromRemote();
  API.startPolling();
  setInterval(() => { updateSyncStatus(); }, 30000);
  const restored = await tryRestoreSession();
  if (!restored) {
    // 尝试用记住的管理员账号自动登录
    const savedUser = localStorage.getItem('photoClubAdminUser');
    const savedPass = localStorage.getItem('photoClubAdminPass');
    if (savedUser && savedPass) {
      try {
        const res = await API.adminLogin(savedUser, savedPass);
        API.token = res.token;
        localStorage.setItem('photoClubToken', res.token);
        state.role = 'admin';
        state.user = res.user;
        await store.loadAll();
        enterApp();
        return;
      } catch(e) { /* 凭证已变更，显示登录页 */ }
    }
    try {
      const s = await API.getPublicSettings();
      store.data.settings = normalizeSettings(s);
    } catch(e) { /* cloud not configured, show login anyway */ }
  }
})();

</script>
